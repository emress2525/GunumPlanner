name: Build Namaz V8 Tam APK

on:
  push:
    branches: [ "namaz-v8-native" ]
    paths:
      - "namaz-v8/**"
      - "namaz-native/**"
      - ".github/workflows/namaz-v8-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: namaz-v8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify V7 regression suite
        run: PYTHONPATH=namaz-native python3 -m unittest discover -s namaz-native -p 'test_*.py' -v
      - name: Fetch verified adhan audio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p namaz-v8/app/src/main/res/raw
          ADHAN_URL='https://raw.githubusercontent.com/Kiwifu/adhan-mp3/main/Adhan_Turkey_1_(%D8%A3%D8%B0%D8%A7%D9%86_%D8%AA%D8%B1%D9%83%D9%8A%D8%A7).mp3'
          curl -fL --retry 3 --retry-delay 2 --connect-timeout 20 "$ADHAN_URL" -o namaz-v8/app/src/main/res/raw/adhan.mp3
          test "$(stat -c%s namaz-v8/app/src/main/res/raw/adhan.mp3)" -gt 100000
      - name: Fetch pinned offline Quran pack
        shell: bash
        run: |
          set -euo pipefail
          REF=34b43b044fb36528be7b2380733bb965b7c5b385
          BASE="https://raw.githubusercontent.com/kurancilar/json/$REF"
          mkdir -p namaz-v8/app/src/main/assets/quran namaz-v8/app/src/main/assets/tafseer/elmalili
          seq 1 114 | xargs -P 8 -I{} bash -c 'curl -fsSL --retry 3 "'"$BASE"'/sure/{}.json" -o "namaz-v8/app/src/main/assets/quran/{}.json"'
          seq 1 114 | xargs -P 8 -I{} bash -c 'curl -fsSL --retry 3 "'"$BASE"'/tafseer/elmalili/{}.md" -o "namaz-v8/app/src/main/assets/tafseer/elmalili/{}.md"'
          test "$(find namaz-v8/app/src/main/assets/quran -name '*.json' | wc -l)" -eq 114
          test "$(find namaz-v8/app/src/main/assets/tafseer/elmalili -name '*.md' | wc -l)" -eq 114
          test "$(stat -c%s namaz-v8/app/src/main/assets/quran/2.json)" -gt 100000
      - name: Unit tests
        run: gradle -p namaz-v8 testDebugUnitTest --stacktrace
      - name: Lint
        run: gradle -p namaz-v8 lintDebug --stacktrace
      - name: Assemble APK
        run: gradle -p namaz-v8 :app:assembleDebug --stacktrace
      - name: Verify complete native source contract
        shell: bash
        run: |
          set -euo pipefail
          APP=namaz-v8/app/src/main/java/app/namaz/tr/v8/ui/NamazApp.kt
          if grep -R --line-number --include='*.kt' --include='*.java' 'android.webkit.WebView' namaz-v8; then
            echo 'WebView dependency found in V8 source' >&2
            exit 1
          fi
          grep -Fq 'QuranScreen()' "$APP"
          grep -Fq 'LearnScreen()' "$APP"
          grep -Fq 'WorshipScreen()' "$APP"
          grep -Fq 'MoreHubScreen(' "$APP"
          if grep -R --line-number -E 'sonraki fazda|sonraki fazlarda' namaz-v8/app/src/main namaz-v8/feature; then
            echo 'Incomplete phase placeholder found in V8 user interface' >&2
            exit 1
          fi
          test -f namaz-v8/feature/quran/src/main/java/app/namaz/tr/v8/quran/QuranFeature.kt
          test -f namaz-v8/feature/learn/src/main/java/app/namaz/tr/v8/learn/LearningFeature.kt
          test -f namaz-v8/feature/worship/src/main/java/app/namaz/tr/v8/worship/WorshipFeature.kt
      - name: Verify APK signature package manifest and offline assets
        shell: bash
        run: |
          set -euo pipefail
          APK=namaz-v8/app/build/outputs/apk/debug/app-debug.apk
          FINAL=Namaz-V8-Tam.apk
          cp "$APK" "$FINAL"
          ${ANDROID_HOME}/build-tools/35.0.0/apksigner verify --verbose "$FINAL"
          unzip -t "$FINAL" >/dev/null
          ${ANDROID_HOME}/build-tools/35.0.0/aapt dump badging "$FINAL" | tee /tmp/v8-badging.txt
          grep -q "package: name='app.namaz.tr.v8' versionCode='8' versionName='8.0.0'" /tmp/v8-badging.txt
          grep -q "application-label:'Namaz V8'" /tmp/v8-badging.txt
          ${ANDROID_HOME}/build-tools/35.0.0/aapt dump xmltree "$FINAL" AndroidManifest.xml > /tmp/v8-manifest.txt
          grep -q 'PrayerAlarmReceiver' /tmp/v8-manifest.txt
          grep -q 'BootReceiver' /tmp/v8-manifest.txt
          grep -q 'AdhanService' /tmp/v8-manifest.txt
          grep -q 'NextPrayerWidgetProvider' /tmp/v8-manifest.txt
          grep -q 'CountdownWidgetProvider' /tmp/v8-manifest.txt
          grep -q 'PrayerTimesWidgetProvider' /tmp/v8-manifest.txt
          grep -q 'PrayerTrackerWidgetProvider' /tmp/v8-manifest.txt
          grep -q 'DailyAyahWidgetProvider' /tmp/v8-manifest.txt
          grep -q 'HijriDateWidgetProvider' /tmp/v8-manifest.txt
          grep -q 'QuranResumeWidgetProvider' /tmp/v8-manifest.txt
          unzip -l "$FINAL" | grep -q 'res/raw/adhan.mp3'
          unzip -l "$FINAL" | grep -q 'assets/quran/114.json'
          unzip -l "$FINAL" | grep -q 'assets/tafseer/elmalili/114.md'
          unzip -l "$FINAL" | grep -q 'assets/content-sources.json'
          sha256sum "$FINAL"
      - uses: actions/upload-artifact@v4
        with:
          name: Namaz-V8-Tam-APK
          path: Namaz-V8-Tam.apk
          if-no-files-found: error
