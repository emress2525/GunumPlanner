name: Afet Atlasi Offline APK
on:
  push:
    branches: [atlas-offline-maps-build]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        run: gradle -p atlas :app:assembleDebug --stacktrace
      - name: Verify APK archive
        run: |
          test -s atlas/app/build/outputs/apk/debug/app-debug.apk
          unzip -t atlas/app/build/outputs/apk/debug/app-debug.apk | tail -1
          sha256sum atlas/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Afet-Atlasi-Harita-Deneme-APK
          path: atlas/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
