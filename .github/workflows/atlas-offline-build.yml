name: Afet Atlasi Offline APK
on:
  push:
    branches: [atlas-offline-maps-build]
  workflow_dispatch:
concurrency:
  group: atlas-offline-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Ensure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"; fi
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        run: gradle -p atlas :app:assembleDebug --stacktrace
      - name: Verify APK archive
        run: |
          test -s atlas/app/build/outputs/apk/debug/app-debug.apk
          unzip -t atlas/app/build/outputs/apk/debug/app-debug.apk | tail -1
          sha256sum atlas/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish direct APK on isolated branch
        run: |
          mkdir -p atlas-dist
          cp atlas/app/build/outputs/apk/debug/app-debug.apk atlas-dist/Afet_Atlasi_Harita_Deneme.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atlas-dist/Afet_Atlasi_Harita_Deneme.apk
          git commit -m "Publish test APK [skip ci]" || true
          git push origin HEAD:atlas-offline-maps-build
      - uses: actions/upload-artifact@v4
        with:
          name: Afet-Atlasi-Harita-Deneme-APK
          path: atlas/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  android-smoke:
    name: Android emulator first-launch smoke test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Afet-Atlasi-Harita-Deneme-APK
          path: test-apk
      - name: Enable KVM for faster emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            adb install test-apk/app-debug.apk
            adb shell am start -n org.afetatlas.offline/.MainActivity
            sleep 10
            adb shell dumpsys activity activities > android_state.txt
            adb logcat -d -b crash > android_crash_log.txt
            adb exec-out screencap -p > android_screenshot.png
            if grep -q 'FATAL EXCEPTION' android_crash_log.txt; then
              cat android_crash_log.txt
              exit 1
            fi
            if ! grep -q 'org.afetatlas.offline' android_state.txt; then
              echo "Atlas launch could not be confirmed"
              exit 1
            fi
      - name: Preserve device smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Atlas-Android-Emulator-Smoke-Evidence
          path: |
            android_state.txt
            android_crash_log.txt
            android_screenshot.png
          if-no-files-found: ignore
          retention-days: 15
