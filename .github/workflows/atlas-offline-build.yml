name: Afet Atlasi Offline APK
on:
  push:
    branches: [atlas-offline-maps-build, atlas-integrations-review, atlas-ready-to-test]
  workflow_dispatch:
concurrency:
  group: atlas-offline-build-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Ensure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"; fi
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"
      - name: Prepare pinned BRouter engine and routing profiles
        run: bash atlas/prepare-brouter.sh
      - name: Collect licensed offline plant images from Wikimedia Commons
        run: python3 atlas/prepare-plant-images.py
      - name: Install offline video render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          command -v ffmpeg
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
      - name: Render ten original offline instructional MP4 clips
        run: python3 atlas/prepare-videos.py
      - name: Validate offline video archive count
        run: |
          test "$(find atlas/app/src/main/assets/educational_videos -name '*.mp4' | wc -l)" -eq 10
          for f in atlas/app/src/main/assets/educational_videos/*.mp4; do
            ffprobe -v error -show_entries format=duration -of default=nw=1 "$f" | grep -q duration
          done
      - name: Build APK
        run: gradle -p atlas :app:assembleDebug --stacktrace
      - name: Calculate three genuine offline Ankara road routes
        run: |
          mkdir -p atlas/route-tests/fixtures/segments4 atlas/route-tests/classes
          curl -fL --retry 3 --connect-timeout 30 --max-time 240             "https://brouter.de/brouter/segments4/E30_N35.rd5"             -o atlas/route-tests/fixtures/segments4/E30_N35.rd5
          test "$(stat -c %s atlas/route-tests/fixtures/segments4/E30_N35.rd5)" -gt 1000000
          find atlas/vendor/brouter/brouter-core/src/main/java                atlas/vendor/brouter/brouter-mapaccess/src/main/java                atlas/vendor/brouter/brouter-util/src/main/java                atlas/vendor/brouter/brouter-expressions/src/main/java                atlas/vendor/brouter/brouter-codec/src/main/java                -type f -name '*.java' -print > atlas/route-tests/sources.txt
          echo atlas/route-tests/StandaloneRouteSmoke.java >> atlas/route-tests/sources.txt
          javac -encoding UTF-8 -d atlas/route-tests/classes @atlas/route-tests/sources.txt
          java -Xmx1024m -cp atlas/route-tests/classes StandaloneRouteSmoke             atlas/route-tests/fixtures/segments4 atlas/app/src/main/assets/brouter
      - name: Verify all 47 licensed pictures and ten videos really exist inside APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,zipfile
          path='atlas/app/build/outputs/apk/debug/app-debug.apk'
          root=Path('atlas/app/src/main/assets')
          info=json.loads((root/'plant_photos/photo_metadata.json').read_text('utf-8'))
          assert len(info)==47, f'Only {len(info)} photos have license records'
          for scientific,entry in info.items():
              assert entry['license'] and entry['author'] and entry['source']
              assert (root/'plant_photos'/entry['filename']).stat().st_size>500
          with zipfile.ZipFile(path) as z:
              names=set(z.namelist())
              for entry in info.values():
                  assert 'assets/plant_photos/'+entry['filename'] in names, entry['filename']
              for i in ('acil_cagri','kanama','yanik','cpr','deprem','sel','yangin','serpinti','su','hipotermi'):
                  assert 'assets/educational_videos/'+i+'.mp4' in names, i
              print('APK_BUNDLED_CONTENT_PASS',len(info),'licensed photographs, 10 H264 MP4 videos')
          PY
      - name: Verify APK archive
        run: |
          test -s atlas/app/build/outputs/apk/debug/app-debug.apk
          unzip -t atlas/app/build/outputs/apk/debug/app-debug.apk | tail -1
          sha256sum atlas/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish test APK with checksums
        if: github.ref == 'refs/heads/atlas-ready-to-test'
        run: |
          mkdir -p atlas-dist
          cp atlas/app/build/outputs/apk/debug/app-debug.apk atlas-dist/Hayatta_Kalma_Atlasi_Telefon_Testi_v0.4.apk
          cd atlas-dist
          sha256sum Hayatta_Kalma_Atlasi_Telefon_Testi_v0.4.apk > SHA256SUMS.txt
          printf '%s\n' 'Hayatta Kalma Atlası - Telefon Testi v0.4.0' '273 cevrimdisi rehber, 47 lisansli bitki fotografi, 10 sessiz egitim videosu, offline BRouter ve Mapsforge harita altyapisi.' 'Tum Turkiye Mapsforge .map dosyasi (~570 MB) ilk kurulumda ayrica indirilmelidir.' 'BRouter rd5 yol agi dosyalari da ilk rota hesaplamasinda internet gerektirir.' 'Bu bir deneme APK dosyasidir. Saglik egitiminin veya guncel resmi acil durum talimatlarinin yerine gecmez.' 'Test sirasinda uygulamanin Test/Hata sekmesinden raporu kopyalayip ChatGPT sohbete yapistirin.' > TELEFON_TEST_BILGILERI.txt
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atlas-dist/Hayatta_Kalma_Atlasi_Telefon_Testi_v0.4.apk atlas-dist/SHA256SUMS.txt atlas-dist/TELEFON_TEST_BILGILERI.txt
          git commit -m "Publish verified user trial APK [skip ci]" || true
          git push origin HEAD:atlas-ready-to-test
      - name: Publish direct APK on isolated branch
        if: github.ref == 'refs/heads/atlas-offline-maps-build'
        run: |
          mkdir -p atlas-dist
          cp atlas/app/build/outputs/apk/debug/app-debug.apk atlas-dist/Afet_Atlasi_Harita_Deneme.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atlas-dist/Afet_Atlasi_Harita_Deneme.apk
          git commit -m "Publish test APK [skip ci]" || true
          git push origin HEAD:atlas-offline-maps-build
      - uses: actions/upload-artifact@v4
        with:
          name: Afet-Atlasi-Harita-Deneme-APK
          path: atlas/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  android-smoke:
    name: Android emulator first-launch smoke test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Afet-Atlasi-Harita-Deneme-APK
          path: test-apk
      - name: Enable KVM for faster emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            adb install test-apk/app-debug.apk
            adb shell am start -n org.afetatlas.offline/.MainActivity
            sleep 10
            adb shell dumpsys activity activities > android_state.txt
            adb logcat -d -b crash > android_crash_log.txt
            adb exec-out screencap -p > android_screenshot.png
            if grep -q 'FATAL EXCEPTION' android_crash_log.txt; then cat android_crash_log.txt; exit 1; fi
            if ! grep -q 'org.afetatlas.offline' android_state.txt; then echo "Atlas launch could not be confirmed"; exit 1; fi
      - name: Preserve device smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Atlas-Android-Emulator-Smoke-Evidence
          path: |
            android_state.txt
            android_crash_log.txt
            android_screenshot.png
          if-no-files-found: ignore
          retention-days: 15
