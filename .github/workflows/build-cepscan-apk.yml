name: Build CepScan APK

on:
  push:
    branches:
      - cepscan-apk-build
    paths:
      - 'cepscan_build.tar.gz.b64'
      - '.github/workflows/build-cepscan-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore CepScan source
        shell: bash
        run: |
          mkdir -p cepscan-src
          base64 --decode cepscan_build.tar.gz.b64 > cepscan_build.tar.gz
          tar -xzf cepscan_build.tar.gz -C cepscan-src
          test -f cepscan-src/build.gradle.kts
          test -f cepscan-src/app/build.gradle.kts

      - name: Build debug APK
        shell: bash
        working-directory: cepscan-src
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK='cepscan-src/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          cp "$APK" CepScan-V3-debug.apk
          sha256sum CepScan-V3-debug.apk | tee CepScan-V3-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CepScan-V3-APK
          path: |
            CepScan-V3-debug.apk
            CepScan-V3-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7
