name: Build CepScan APK

on:
  push:
    branches:
      - cepscan-apk-build
    paths:
      - 'cepscan_parts/**'
      - 'cepscan_v4_parts/**'
      - '.github/workflows/build-cepscan-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore CepScan V3 base
        shell: bash
        run: |
          mkdir -p cepscan-src
          cat cepscan_parts/part_* > cepscan_build.tar.gz.b64
          test "$(wc -c < cepscan_build.tar.gz.b64)" = "51768"
          echo '281441f4028fb934b040144fc6cdf81b94a14def6a29cb690459e3a36be62fb7  cepscan_build.tar.gz' > expected.sha256
          base64 --decode cepscan_build.tar.gz.b64 > cepscan_build.tar.gz
          sha256sum -c expected.sha256
          tar -xzf cepscan_build.tar.gz -C cepscan-src
          test -f cepscan-src/build.gradle.kts
          test -f cepscan-src/app/build.gradle.kts

      - name: Restore and verify CepScan V4 patch
        shell: bash
        run: |
          cat cepscan_v4_parts/part_* > cepscan_v4_patch.gz.b64
          test "$(wc -c < cepscan_v4_patch.gz.b64)" = "13940"
          echo 'aa8306ea3c407107f7b3ee33f5bb061350b932ece5a2ea9c1b57624e92385ea4  cepscan_v4_patch.gz.b64' | sha256sum -c -
          base64 --decode cepscan_v4_patch.gz.b64 | gzip -d > cepscan-v4.patch
          test -s cepscan-v4.patch

      - name: Apply CepScan V4 changes
        shell: bash
        run: |
          git apply --check --verbose --directory=cepscan-src cepscan-v4.patch
          git apply --verbose --directory=cepscan-src cepscan-v4.patch
          grep -n 'versionName = "4.0.0"' cepscan-src/app/build.gradle.kts
          test -f cepscan-src/app/src/main/java/com/cepscan/app/ui/PdfViewerScreen.kt

      - name: Build debug APK
        shell: bash
        working-directory: cepscan-src
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK signature and package
        shell: bash
        run: |
          APK='cepscan-src/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee CepScan-V4-badging.txt
          cp "$APK" CepScan-V4-debug.apk
          sha256sum CepScan-V4-debug.apk | tee CepScan-V4-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CepScan-V4-APK
          path: |
            CepScan-V4-debug.apk
            CepScan-V4-debug.apk.sha256
            CepScan-V4-badging.txt
          if-no-files-found: error
          retention-days: 7
