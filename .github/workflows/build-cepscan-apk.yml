name: Build CepScan APK

on:
  push:
    branches:
      - cepscan-apk-build
    paths:
      - 'cepscan_parts/**'
      - '.github/workflows/build-cepscan-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore and verify CepScan source
        shell: bash
        run: |
          mkdir -p cepscan-src
          cat cepscan_parts/part_* > cepscan_build.tar.gz.b64
          test "$(wc -c < cepscan_build.tar.gz.b64)" = "51768"
          echo '281441f4028fb934b040144fc6cdf81b94a14def6a29cb690459e3a36be62fb7  cepscan_build.tar.gz' > expected.sha256
          base64 --decode cepscan_build.tar.gz.b64 > cepscan_build.tar.gz
          sha256sum -c expected.sha256
          tar -xzf cepscan_build.tar.gz -C cepscan-src
          test -f cepscan-src/build.gradle.kts
          test -f cepscan-src/app/build.gradle.kts

      - name: Apply PdfEngine Kotlin compile fix
        shell: bash
        run: |
          python3 - <<'PYFIX'
          from pathlib import Path
          p = Path('cepscan-src/app/src/main/java/com/cepscan/app/pdf/PdfEngine.kt')
          s = p.read_text()
          s = s.replace('        PdfDocument().use { pdf ->', '        val pdf = PdfDocument()\n        try {', 1)
          old = '''            context.contentResolver.openOutputStream(destination, "rwt").use { output ->
                requireNotNull(output) { "PDF hedefi açılamadı." }
                pdf.writeTo(output)
            }
        }
    }'''
          new = '''            context.contentResolver.openOutputStream(destination, "rwt").use { output ->
                requireNotNull(output) { "PDF hedefi açılamadı." }
                pdf.writeTo(output)
            }
        } finally {
            pdf.close()
        }
    }'''
          if old not in s:
              raise SystemExit('PdfEngine tail patch target not found')
          p.write_text(s.replace(old, new, 1))
          PYFIX
          grep -n "val pdf = PdfDocument\|finally\|pdf.close" cepscan-src/app/src/main/java/com/cepscan/app/pdf/PdfEngine.kt | head -10

      - name: Build debug APK
        shell: bash
        working-directory: cepscan-src
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK signature and package
        shell: bash
        run: |
          APK='cepscan-src/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee CepScan-V3-badging.txt
          cp "$APK" CepScan-V3-debug.apk
          sha256sum CepScan-V3-debug.apk | tee CepScan-V3-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CepScan-V3-APK
          path: |
            CepScan-V3-debug.apk
            CepScan-V3-debug.apk.sha256
            CepScan-V3-badging.txt
          if-no-files-found: error
          retention-days: 7
