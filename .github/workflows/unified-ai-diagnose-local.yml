name: Unified AI diagnose local model

on:
  push:
    branches: [unified-ai-build-temp]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-local-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct current Android source
        shell: bash
        run: |
          set -euo pipefail
          cat unified-ai-fixed/part00-00.b64 unified-ai-fixed/part00-01.b64 unified-ai-fixed/part00-02.b64 unified-ai-fixed/part00-03.b64 unified-ai-fixed/part00-04.b64 unified-ai-fixed/part00-05.b64 unified-ai-fixed/part00-06.b64 unified-ai-fixed/part00-07.b64 unified-ai-fixed/part00-08.b64 > /tmp/part00.b64
          cat /tmp/part00.b64 unified-ai-parts/part01.b64 unified-ai-parts/part02.b64 unified-ai-parts/part03.b64 unified-ai-parts/part04.b64 unified-ai-parts/part050.b64 unified-ai-parts/part051.b64 unified-ai-parts/part052.b64 unified-ai-parts/part053.b64 unified-ai-parts/part054.b64 unified-ai-parts/part055.b64 > /tmp/unified-ai-source.b64
          base64 --decode /tmp/unified-ai-source.b64 > /tmp/unified-ai-source.zip
          rm -rf unified-ai-app && mkdir unified-ai-app
          unzip -q /tmp/unified-ai-source.zip -d unified-ai-app
          tar -xzf unified-ai-fix2.tar.gz -C unified-ai-app
          cat unified-ai-current-patch/part00.b64 unified-ai-current-patch/part01.b64 unified-ai-current-patch/part02.b64 unified-ai-current-patch/part03-00.b64 unified-ai-current-patch/part03-01.b64 unified-ai-current-patch/part03-02.b64 unified-ai-current-patch/part03-03.b64 unified-ai-current-patch/part03-04.b64 > /tmp/current-phone-local-patch.b64
          base64 --decode /tmp/current-phone-local-patch.b64 > /tmp/current-phone-local-patch.zip
          unzip -qo /tmp/current-phone-local-patch.zip -d unified-ai-app
      - name: Print local model and HTTP wiring
        shell: bash
        run: |
          set -euo pipefail
          echo '=== CURRENT local/OnDeviceModelManager.kt ==='
          cat unified-ai-app/app/src/main/java/com/unifiedai/app/data/provider/local/OnDeviceModelManager.kt
          echo '=== PREVIOUS ondevice/OnDeviceModelManager.kt ==='
          cat unified-ai-app/app/src/main/java/com/unifiedai/app/data/provider/ondevice/OnDeviceModelManager.kt
          echo '=== AppContainer.kt ==='
          cat unified-ai-app/app/src/main/java/com/unifiedai/app/AppContainer.kt
          echo '=== HttpClientFactory.kt ==='
          cat unified-ai-app/app/src/main/java/com/unifiedai/app/core/network/HttpClientFactory.kt
          echo '=== OnDeviceModelManager wiring ==='
          grep -RIn 'OnDeviceModelManager' unified-ai-app/app/src/main/java || true
          echo '=== OkHttp builders/interceptors/timeouts ==='
          grep -RInE 'OkHttpClient|Interceptor|interceptor|callTimeout|readTimeout|writeTimeout|connectTimeout|followRedirects|followSslRedirects' unified-ai-app/app/src/main/java || true
          echo '=== URL / expected size references ==='
          grep -RInE '347251840|https?://|expected|contentLength|Content-Length|download|modelUrl|MODEL_URL' unified-ai-app/app/src/main/java/com/unifiedai/app/data/provider/local || true
      - name: Probe model URL with Android-like request
        shell: bash
        run: |
          set -euo pipefail
          URL='https://huggingface.co/litert-community/Qwen3-0.6B-int4/resolve/main/qwen3_0.6b_nothink_q4_block32_ekv1280.litertlm?download=true'
          rm -f /tmp/model.headers /tmp/model.range
          curl --fail-with-body --location --max-redirs 10 --connect-timeout 20 --max-time 60 \
            -A 'BirlesikAI/0.2 Android' -H 'Range: bytes=0-1023' \
            -D /tmp/model.headers -o /tmp/model.range "$URL"
          echo '=== Redirect/final headers ==='
          grep -Ei '^(HTTP/|location:|content-length:|content-range:|content-type:|accept-ranges:)' /tmp/model.headers || true
          echo '=== Downloaded range bytes ==='
          wc -c /tmp/model.range
          test "$(wc -c < /tmp/model.range)" -gt 0
