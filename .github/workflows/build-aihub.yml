name: Build Nexus AI APK

on:
  push:
    branches: [ "ai-nexus-apk" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests
        run: gradle :aihub:testDebugUnitTest --stacktrace

      - name: Lint
        run: gradle :aihub:lintDebug --stacktrace

      - name: Live no-login text failover smoke test
        run: |
          python3 - <<'PY'
          import json, urllib.request
          endpoints = [
              ('Vireonix Auto', 'https://vireonix.ai/v1/chat/completions', 'auto'),
              ('Animica Kimi', 'https://animica.dev/v1/chat/completions', 'kimi-k3'),
              ('Cehpoint AI', 'https://ai-api.cehpoint.co.in/v1/chat/completions', 'cehpoint-ai'),
          ]
          errors = []
          for name, url, model in endpoints:
              try:
                  payload = json.dumps({
                      'model': model,
                      'stream': False,
                      'messages': [{'role':'user','content':'Reply briefly with NEXUS_OK'}]
                  }).encode()
                  request = urllib.request.Request(
                      url, data=payload,
                      headers={'Content-Type':'application/json','Accept':'application/json','User-Agent':'NexusAI/2.3 Android'}
                  )
                  with urllib.request.urlopen(request, timeout=30) as response:
                      body = json.load(response)
                  text = body['choices'][0]['message']['content'].strip()
                  if text:
                      print(f'Live text engine OK: {name}: {text[:100]}')
                      raise SystemExit(0)
                  errors.append(f'{name}: empty response')
              except SystemExit:
                  raise
              except Exception as exc:
                  errors.append(f'{name}: {type(exc).__name__}: {exc}')
                  print(errors[-1])
          raise SystemExit('All no-login text engines failed:\n' + '\n'.join(errors))
          PY

      - name: Live task-focused coding smoke test
        run: |
          python3 - <<'PY'
          import json, urllib.request
          endpoints = [
              ('Vireonix Auto', 'https://vireonix.ai/v1/chat/completions', 'auto'),
              ('Animica Kimi', 'https://animica.dev/v1/chat/completions', 'kimi-k3'),
              ('Cehpoint AI', 'https://ai-api.cehpoint.co.in/v1/chat/completions', 'cehpoint-ai'),
          ]
          system = (
              "You are Nexus AI, a high-capability task-focused assistant in coding mode. "
              "Solve the user's actual engineering task directly. Do not begin with generic capability disclaimers. "
              "For app, Android, project or APK requests, produce a complete implementation with project/file structure, "
              "build configuration, manifests, source files and tests as appropriate. Do not use TODOs, placeholders or fake APIs. "
              "Do not make 'I cannot create a compiled APK' or 'compile it yourself' the answer. "
              "Never claim a compiled file exists when it does not. Always answer in the same language as the user."
          )
          user = "Bana promt yazıcı uygulaması yap telefon için APK ver. Eksiksiz ve uygulanabilir şekilde yap."
          evasions = (
              'apk dosyası üretemiyorum', 'apk oluşturamıyorum', 'doğrudan derlenmiş apk',
              'sadece kaynak kod', 'yalnızca kaynak kod', 'kendin derleyebilirsin', 'kendiniz derleyebilirsiniz',
              'cannot generate an apk', "can't generate an apk", 'cannot provide a compiled apk',
              'i can only provide source code', 'you can compile it yourself'
          )
          markers = ('androidmanifest', 'build.gradle', 'settings.gradle', 'mainactivity', 'kotlin', 'java', 'proje', 'dosya', 'kod')
          errors=[]
          for name,url,model in endpoints:
              try:
                  payload=json.dumps({'model':model,'stream':False,'messages':[{'role':'system','content':system},{'role':'user','content':user}]}).encode()
                  req=urllib.request.Request(url,data=payload,headers={'Content-Type':'application/json','Accept':'application/json','User-Agent':'NexusAI/2.3 Android'})
                  with urllib.request.urlopen(req,timeout=60) as response:
                      body=json.load(response)
                  text=body['choices'][0]['message']['content'].strip()
                  lower=text.lower()
                  turkish=any(x in lower for x in (' uygulama',' için ',' dosya',' proje',' kod',' özellik')) or any(c in text for c in 'çğıöşüÇĞİÖŞÜ')
                  evasion=any(x in lower for x in evasions)
                  implementation=sum(1 for x in markers if x in lower)
                  if len(text) >= 250 and turkish and not evasion and implementation >= 2:
                      print('Task-focused coding OK:',name,text[:220].replace('\n',' '))
                      raise SystemExit(0)
                  errors.append(f'{name}: unsuitable answer: {text[:220]}')
              except SystemExit:
                  raise
              except Exception as exc:
                  errors.append(f'{name}: {type(exc).__name__}: {exc}')
          raise SystemExit('All coding engines failed task-focused quality gate:\n'+'\n'.join(errors))
          PY

      - name: Live keyless web search smoke test
        run: |
          python3 - <<'PY'
          import re, urllib.parse, urllib.request
          q = urllib.parse.quote_plus('prompt generator apps best features')
          headers = {
              'User-Agent':'Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 NexusAI/2.3',
              'Accept':'text/html,application/xhtml+xml,application/rss+xml,application/xml;q=0.9,*/*;q=0.8'
          }
          candidates = [
              ('Bing RSS', 'https://www.bing.com/search?q=' + q + '&format=rss', r'<item[ >]'),
              ('DuckDuckGo Lite', 'https://lite.duckduckgo.com/lite/?q=' + q, r'result-link'),
          ]
          errors=[]
          for name,url,marker in candidates:
              try:
                  req=urllib.request.Request(url,headers=headers)
                  with urllib.request.urlopen(req,timeout=30) as response:
                      text=response.read(1000000).decode('utf-8','replace')
                  count=len(re.findall(marker,text,re.I))
                  print(name,'result markers:',count)
                  if count >= 2:
                      raise SystemExit(0)
                  errors.append(f'{name}: only {count} results')
              except SystemExit:
                  raise
              except Exception as exc:
                  errors.append(f'{name}: {type(exc).__name__}: {exc}')
          raise SystemExit('All keyless web search transports failed:\n'+'\n'.join(errors))
          PY

      - name: Live end-to-end Turkish research smoke test
        run: |
          python3 - <<'PY'
          import html, json, re, urllib.parse, urllib.request, xml.etree.ElementTree as ET
          query='prompt generator apps best features prompt engineering tools'
          q=urllib.parse.quote_plus(query)
          req=urllib.request.Request(
              'https://www.bing.com/search?q='+q+'&format=rss',
              headers={'User-Agent':'Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 NexusAI/2.3','Accept':'application/rss+xml,application/xml;q=0.9,*/*;q=0.8'}
          )
          with urllib.request.urlopen(req,timeout=30) as response:
              raw=response.read(1000000)
          root=ET.fromstring(raw)
          items=root.findall('.//item')[:5]
          if len(items) < 2:
              raise SystemExit('Bing RSS returned too few research results')
          sources=[]
          for item in items:
              title=(item.findtext('title') or '').strip()
              link=(item.findtext('link') or '').strip()
              desc=re.sub(r'<[^>]+>',' ',html.unescape(item.findtext('description') or ''))
              desc=re.sub(r'\s+',' ',desc).strip()
              if link.startswith('http'):
                  sources.append((title,link,desc))
          if len(sources) < 2:
              raise SystemExit('Research source parsing failed')
          source_text='\n\n'.join(f'[{i+1}] {t}\nURL: {u}\nÖzet: {d}' for i,(t,u,d) in enumerate(sources))
          system=('You are Nexus AI research mode. The user message contains LIVE WEB SEARCH RESULTS gathered by the app. '
                  'Use those results as evidence. Compare alternatives. Do not claim you lack web access. Never invent a URL. '
                  'If the user writes in Turkish, the ENTIRE answer must be Turkish.')
          user=('KULLANICININ İSTEĞİ:\nPrompt yazıcı uygulamalarını piyasadakilerle araştır; güçlü ve zayıf yönleri karşılaştır ve en iyi ürün tasarımını öner.\n\n'
                'CANLI WEB ARAMA SONUÇLARI:\n'+source_text+'\n\nTürkçe cevap ver; reddetme, eldeki kaynaklarla yararlı bir sentez üret.')
          endpoints=[
              ('Vireonix Auto','https://vireonix.ai/v1/chat/completions','auto'),
              ('Animica Kimi','https://animica.dev/v1/chat/completions','kimi-k3'),
              ('Cehpoint AI','https://ai-api.cehpoint.co.in/v1/chat/completions','cehpoint-ai'),
          ]
          refusals=('i cannot fulfill','i can\'t fulfill','do not have web access','information is unavailable','cannot browse')
          errors=[]
          for name,url,model in endpoints:
              try:
                  payload=json.dumps({'model':model,'stream':False,'messages':[{'role':'system','content':system},{'role':'user','content':user}]}).encode()
                  request=urllib.request.Request(url,data=payload,headers={'Content-Type':'application/json','Accept':'application/json','User-Agent':'NexusAI/2.3 Android'})
                  with urllib.request.urlopen(request,timeout=45) as response:
                      body=json.load(response)
                  text=body['choices'][0]['message']['content'].strip()
                  lower=' '+text.lower()+' '
                  turkish=any(x in lower for x in (' ve ',' için ',' uygulama',' özellik',' kaynak',' öner',' güçlü',' zayıf')) or any(c in text for c in 'çğıöşüÇĞİÖŞÜ')
                  refused=any(r in lower for r in refusals)
                  if len(text) >= 120 and turkish and not refused:
                      print('End-to-end grounded Turkish research OK:',name,text[:200].replace('\n',' '))
                      raise SystemExit(0)
                  errors.append(f'{name}: unsuitable answer: {text[:180]}')
              except SystemExit:
                  raise
              except Exception as exc:
                  errors.append(f'{name}: {type(exc).__name__}: {exc}')
          raise SystemExit('All grounded research engines failed:\n'+'\n'.join(errors))
          PY

      - name: Live no-login image smoke test
        run: |
          python3 - <<'PY'
          import json, urllib.request
          url='https://ahm7xmakki.com/api/tti'
          payload=json.dumps({'prompt':'minimal blue circle icon on white background','ratio':'1:1'}).encode()
          request=urllib.request.Request(url,data=payload,headers={'Content-Type':'application/json','User-Agent':'NexusAI/2.3 Android'})
          with urllib.request.urlopen(request,timeout=90) as response:
              body=json.load(response)
          image_url=body.get('imageUrl','')
          if not image_url.startswith('https://'):
              raise SystemExit('Image endpoint did not return an HTTPS image URL')
          print('Live image endpoint returned a valid URL')
          PY

      - name: Build debug APK
        run: |
          gradle :aihub:assembleDebug --stacktrace
          cp aihub/build/outputs/apk/debug/aihub-debug.apk NexusAI-v2.3-smart-answer.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NexusAI-v2.3-smart-answer-apk
          path: NexusAI-v2.3-smart-answer.apk
          if-no-files-found: error
