name: Build Nexus AI APK

on:
  push:
    branches: [ "ai-nexus-apk" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests
        run: gradle :aihub:testDebugUnitTest --stacktrace

      - name: Lint
        run: gradle :aihub:lintDebug --stacktrace

      - name: Build debug APK
        run: gradle :aihub:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NexusAI-debug-apk
          path: aihub/build/outputs/apk/debug/aihub-debug.apk
          if-no-files-found: error
