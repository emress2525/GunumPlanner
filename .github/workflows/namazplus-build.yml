name: Build NamazPlus APK

on:
  push:
    branches:
      - namazplus-build-20260914
    paths-ignore:
      - 'NamazPlus.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4
        with:
          ref: namazplus-build-20260914

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct source archive
        shell: bash
        run: |
          cat namazplus-build/source.part1 namazplus-build/source.part2 namazplus-build/source.part3 namazplus-build/source.part4 | base64 -d > /tmp/NamazPlus-build-input.zip
          echo '1cf96260d7877106690bb59431903e45cc6635bb087651a7c5105ea4e3cc1aca  /tmp/NamazPlus-build-input.zip' | sha256sum -c -
          rm -rf /tmp/namazplus-build
          mkdir -p /tmp/namazplus-build
          unzip -q /tmp/NamazPlus-build-input.zip -d /tmp/namazplus-build
          test -f /tmp/namazplus-build/NamazPlus-build-input/app/build.gradle

      - name: Build debug APK
        shell: bash
        run: |
          cd /tmp/namazplus-build/NamazPlus-build-input
          gradle :app:assembleDebug --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/NamazPlus.apk"
          sha256sum "$GITHUB_WORKSPACE/NamazPlus.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NamazPlus-debug-apk
          path: NamazPlus.apk
          if-no-files-found: error

      - name: Publish APK on build branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add NamazPlus.apk
          if git diff --cached --quiet; then
            echo 'APK unchanged.'
          else
            git commit -m 'build: publish NamazPlus APK [skip ci]'
            git push origin HEAD:namazplus-build-20260914
          fi
