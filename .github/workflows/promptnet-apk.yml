name: PromptNet APK

on:
  push:
    branches: [promptnet-apk-build]
    paths:
      - 'promptnet-apk/**'
      - '.github/workflows/promptnet-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install Android SDK 37
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-37' 'build-tools;36.0.0' 'platform-tools'

      - name: Unit test and build APK
        run: gradle -p promptnet-apk clean testDebugUnitTest assembleDebug --stacktrace

      - name: Prepare artifact
        shell: bash
        run: |
          cp promptnet-apk/app/build/outputs/apk/debug/app-debug.apk PromptNet-debug.apk
          sha256sum PromptNet-debug.apk | tee PromptNet-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PromptNet-APK
          path: |
            PromptNet-debug.apk
            PromptNet-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7
