name: CepScan Android 16 PDF Diagnostic

on:
  push:
    branches:
      - cepscan-apk-build
    paths:
      - '.github/workflows/cepscan-startup-diagnostic.yml'
      - 'tools/cepscan_emulator_pdf_test.sh'
      - 'tools/apply_cepscan_v42.py'
      - 'tools/test_no_recycled_bitmap.py'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'emulator' 'system-images;android-36;default;x86_64'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore source and apply V4.2 fix
        shell: bash
        run: |
          mkdir -p cepscan-src
          cat cepscan_parts/part_* > cepscan_build.tar.gz.b64
          base64 --decode cepscan_build.tar.gz.b64 > cepscan_build.tar.gz
          tar -xzf cepscan_build.tar.gz -C cepscan-src
          cat cepscan_v4_parts/part_* > cepscan_v4_patch.gz.b64
          base64 --decode cepscan_v4_patch.gz.b64 | gzip -d > cepscan-v4.patch
          git apply --directory=cepscan-src cepscan-v4.patch
          echo '3ff13c67f690f4b778d6ca79d820d64eeb99908e9b10ff7e92ce4a8440822bdd  cepscan-v41.patch.gz' | sha256sum -c -
          gzip -dc cepscan-v41.patch.gz > cepscan-v41.patch
          git apply --directory=cepscan-src cepscan-v41.patch
          python tools/apply_cepscan_v42.py cepscan-src
          python tools/test_no_recycled_bitmap.py cepscan-src
          grep 'versionName = "4.2.0"' cepscan-src/app/build.gradle.kts

      - name: Build debug APK
        working-directory: cepscan-src
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Open a real PDF on Android 16 and assert no recycled-bitmap crash
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash tools/cepscan_emulator_pdf_test.sh cepscan-src/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload PDF viewer logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CepScan-V4.2-api36-pdf-viewer-logcat
          path: cepscan-pdf-viewer-logcat.txt
          if-no-files-found: warn
          retention-days: 2
