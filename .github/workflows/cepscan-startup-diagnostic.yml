name: CepScan Startup Diagnostic

on:
  push:
    branches:
      - cepscan-apk-build
    paths:
      - '.github/workflows/cepscan-startup-diagnostic.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'emulator' 'system-images;android-36;google_apis;x86_64'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore V3 base
        shell: bash
        run: |
          mkdir -p cepscan-src
          cat cepscan_parts/part_* > cepscan_build.tar.gz.b64
          base64 --decode cepscan_build.tar.gz.b64 > cepscan_build.tar.gz
          tar -xzf cepscan_build.tar.gz -C cepscan-src
      - name: Apply V4 patch
        shell: bash
        run: |
          cat cepscan_v4_parts/part_* > cepscan_v4_patch.gz.b64
          base64 --decode cepscan_v4_patch.gz.b64 | gzip -d > cepscan-v4.patch
          git apply --directory=cepscan-src cepscan-v4.patch
      - name: Build debug APK
        working-directory: cepscan-src
        run: gradle --no-daemon :app:assembleDebug
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Launch and relaunch on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -e
            APK=cepscan-src/app/build/outputs/apk/debug/app-debug.apk
            adb install -r "$APK"
            : > cepscan-startup-logcat.txt
            for N in 1 2 3; do
              echo "=== LAUNCH $N ===" | tee -a cepscan-startup-logcat.txt
              adb shell am force-stop com.cepscan.app
              adb logcat -c
              adb shell monkey -p com.cepscan.app -c android.intent.category.LAUNCHER 1
              sleep 5
              adb logcat -d -v threadtime >> cepscan-startup-logcat.txt
              PID=$(adb shell pidof com.cepscan.app | tr -d '\r')
              echo "pid_$N=$PID" | tee -a cepscan-startup-logcat.txt
              test -n "$PID"
            done
            if grep -q 'FATAL EXCEPTION.*com.cepscan\|Process: com.cepscan.app' cepscan-startup-logcat.txt; then
              grep -n -A100 -B25 -E 'FATAL EXCEPTION|Process: com\.cepscan\.app' cepscan-startup-logcat.txt
              exit 1
            fi
      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CepScan-api36-startup-logcat
          path: cepscan-startup-logcat.txt
          if-no-files-found: warn
          retention-days: 2
