name: CepScan Startup Diagnostic

on:
  push:
    branches:
      - cepscan-apk-build
    paths:
      - '.github/workflows/cepscan-startup-diagnostic.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'emulator' 'system-images;android-35;google_apis;x86_64'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore V3 base
        shell: bash
        run: |
          mkdir -p cepscan-src
          cat cepscan_parts/part_* > cepscan_build.tar.gz.b64
          base64 --decode cepscan_build.tar.gz.b64 > cepscan_build.tar.gz
          tar -xzf cepscan_build.tar.gz -C cepscan-src
      - name: Apply V4 patch
        shell: bash
        run: |
          cat cepscan_v4_parts/part_* > cepscan_v4_patch.gz.b64
          base64 --decode cepscan_v4_patch.gz.b64 | gzip -d > cepscan-v4.patch
          git apply --directory=cepscan-src cepscan-v4.patch
      - name: Build debug APK
        working-directory: cepscan-src
        run: gradle --no-daemon :app:assembleDebug
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Launch app and persisted-document relaunch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -e
            APK=cepscan-src/app/build/outputs/apk/debug/app-debug.apk
            adb install -r "$APK"
            : > cepscan-startup-logcat.txt

            echo '=== CLEAN LAUNCH ===' | tee -a cepscan-startup-logcat.txt
            adb logcat -c
            adb shell am force-stop com.cepscan.app
            adb shell monkey -p com.cepscan.app -c android.intent.category.LAUNCHER 1
            sleep 6
            adb logcat -d -v threadtime >> cepscan-startup-logcat.txt
            CLEAN_PID=$(adb shell pidof com.cepscan.app | tr -d '\r')
            echo "clean_pid=$CLEAN_PID" | tee -a cepscan-startup-logcat.txt
            test -n "$CLEAN_PID"

            echo '/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCA CMA ' | tr -d ' ' | base64 -d > /tmp/page.jpg
            adb push /tmp/page.jpg /data/local/tmp/page.jpg >/dev/null
            adb shell run-as com.cepscan.app mkdir -p files/scans/testdoc shared_prefs
            adb shell run-as com.cepscan.app cp /data/local/tmp/page.jpg files/scans/testdoc/page_001.jpg
            cat > /tmp/cepscan_docs.xml <<'XML'
            <?xml version='1.0' encoding='utf-8' standalone='yes' ?>
            <map>
              <string name="items">[{&quot;id&quot;:&quot;testdoc&quot;,&quot;uri&quot;:&quot;&quot;,&quot;name&quot;:&quot;Tarama_test.pdf&quot;,&quot;pageCount&quot;:1,&quot;createdAt&quot;:1,&quot;updatedAt&quot;:1,&quot;ocrText&quot;:&quot;test&quot;,&quot;correctedOcrText&quot;:&quot;&quot;,&quot;ocrUpdatedAt&quot;:1,&quot;quality&quot;:&quot;STANDARD&quot;,&quot;mode&quot;:&quot;DOCUMENT&quot;,&quot;paperSize&quot;:&quot;AUTO&quot;,&quot;exportDpi&quot;:300,&quot;folder&quot;:&quot;&quot;,&quot;tags&quot;:[],&quot;isFavorite&quot;:false,&quot;isPinned&quot;:false,&quot;isPrivate&quot;:false,&quot;isTrashed&quot;:false,&quot;searchablePdf&quot;:true,&quot;passwordProtected&quot;:false,&quot;isDraft&quot;:true,&quot;smartFields&quot;:{},&quot;pages&quot;:[{&quot;id&quot;:&quot;p1&quot;,&quot;filePath&quot;:&quot;/data/user/0/com.cepscan.app/files/scans/testdoc/page_001.jpg&quot;,&quot;rotation&quot;:0,&quot;filter&quot;:&quot;ORIGINAL&quot;,&quot;enhancementStrength&quot;:50,&quot;dewarpStrength&quot;:0,&quot;annotations&quot;:[],&quot;qualityFindings&quot;:[]}]}]</string>
            </map>
            XML
            adb push /tmp/cepscan_docs.xml /data/local/tmp/cepscan_docs.xml >/dev/null
            adb shell am force-stop com.cepscan.app
            adb shell run-as com.cepscan.app cp /data/local/tmp/cepscan_docs.xml shared_prefs/cepscan_docs.xml

            echo '=== PERSISTED DOCUMENT LAUNCH ===' | tee -a cepscan-startup-logcat.txt
            adb logcat -c
            adb shell monkey -p com.cepscan.app -c android.intent.category.LAUNCHER 1
            sleep 6
            adb logcat -d -v threadtime >> cepscan-startup-logcat.txt
            DOC_PID=$(adb shell pidof com.cepscan.app | tr -d '\r')
            echo "persisted_pid=$DOC_PID" | tee -a cepscan-startup-logcat.txt
            test -n "$DOC_PID"

            echo '=== SECOND RELAUNCH ===' | tee -a cepscan-startup-logcat.txt
            adb shell am force-stop com.cepscan.app
            adb logcat -c
            adb shell monkey -p com.cepscan.app -c android.intent.category.LAUNCHER 1
            sleep 6
            adb logcat -d -v threadtime >> cepscan-startup-logcat.txt
            RELAUNCH_PID=$(adb shell pidof com.cepscan.app | tr -d '\r')
            echo "relaunch_pid=$RELAUNCH_PID" | tee -a cepscan-startup-logcat.txt
            test -n "$RELAUNCH_PID"

            echo '=== FATAL / AndroidRuntime ==='
            grep -n -A100 -B25 -E 'FATAL EXCEPTION|AndroidRuntime|Process: com\.cepscan\.app' cepscan-startup-logcat.txt || true
      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CepScan-startup-logcat
          path: cepscan-startup-logcat.txt
          if-no-files-found: warn
          retention-days: 2
