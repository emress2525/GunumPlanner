name: Jarvis APK Build

on:
  push:
    branches:
      - jarvis-apk-build
    paths:
      - 'jarvis-build/**'
      - '.github/workflows/jarvis-apk-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: jarvis-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Android lint
        run: gradle --no-daemon lintDebug

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK signature and metadata
        run: |
          APK="$PWD/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/jarvis-badging.txt"
          grep -q "package: name='com.sesliasistan.jarvis'" "$RUNNER_TEMP/jarvis-badging.txt"
          grep -q "versionName='1.1.0'" "$RUNNER_TEMP/jarvis-badging.txt"
          grep -q "sdkVersion:'29'" "$RUNNER_TEMP/jarvis-badging.txt"
          grep -q "targetSdkVersion:'36'" "$RUNNER_TEMP/jarvis-badging.txt"
          sha256sum "$APK" | tee "$RUNNER_TEMP/jarvis-sha256.txt"

      - name: Android 16 runtime smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -eu
            APK="$GITHUB_WORKSPACE/jarvis-build/app/build/outputs/apk/debug/app-debug.apk"
            adb install -r "$APK"
            adb shell pm path com.sesliasistan.jarvis | tee "$RUNNER_TEMP/jarvis-pm-path.txt"
            grep -q '^package:' "$RUNNER_TEMP/jarvis-pm-path.txt"
            adb shell am start -W -n com.sesliasistan.jarvis/.MainActivity | tee "$RUNNER_TEMP/jarvis-launch.txt"
            grep -q 'Status: ok' "$RUNNER_TEMP/jarvis-launch.txt"
            adb shell dumpsys package com.sesliasistan.jarvis | grep -q 'versionName=1.1.0'

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-verified-apk
          path: jarvis-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish retrievable build payload
        run: |
          mkdir -p ../jarvis-output
          base64 -w0 app/build/outputs/apk/debug/app-debug.apk > ../jarvis-output/Jarvis.apk.b64
          cp "$RUNNER_TEMP/jarvis-badging.txt" ../jarvis-output/badging.txt
          cp "$RUNNER_TEMP/jarvis-sha256.txt" ../jarvis-output/sha256.txt
          cd ..
          git config user.name 'Jarvis CI'
          git config user.email 'jarvis-ci@users.noreply.github.com'
          git add jarvis-output
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build(jarvis): publish verified APK [skip ci]'
          git push origin HEAD:jarvis-apk-build
