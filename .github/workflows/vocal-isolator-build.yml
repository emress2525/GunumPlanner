name: Vocal Isolator APK

on:
  push:
    branches: [ "vocal-isolator-build" ]
    paths:
      - "vocal-isolator-build/**"
      - ".github/workflows/vocal-isolator-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: vocal-isolator-build/project

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager             "platform-tools"             "platforms;android-37"             "build-tools;36.0.0"             "ndk;28.2.13676358"             "cmake;3.22.1"

      - name: Fetch pinned Demucs model
        run: python3 scripts/fetch_demucs_model.py

      - name: Vendor pinned demucs.cpp
        run: bash scripts/vendor_demucs_cpp.sh

      - name: Verify pinned inputs
        shell: bash
        run: |
          echo "72b17c42d308982ddb5069bc3bf48b81a5aac4cb6516e4366c0fa7cef6df0064  app/src/main/assets/models/ggml-htdemucs-4s-f16.bin" | sha256sum -c -
          test "$(cat app/src/main/cpp/third_party/demucs_cpp/VERSION)" = "v0.0.4-alpha"
          test -f app/src/main/cpp/third_party/demucs_cpp/LICENSE

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -20
          sha256sum "$APK" | tee app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VocalIsolator-debug-apk
          path: |
            vocal-isolator-build/project/app/build/outputs/apk/debug/app-debug.apk
            vocal-isolator-build/project/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 3
