name: Tevkil Radari - APK
on:
  push:
    branches: [tevkil-radari-mvp]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
      - name: Expand project
        run: |
          tar -xzf TevkilRadar-source.tar.gz
          cp tevkil-fixes/styles.xml TevkilRadar/app/src/main/res/values/styles.xml
          # API 26-32 requires the legacy 2-argument receiver registration; API 33+ uses NOT_EXPORTED.
          sed -i '/@Override protected void onResume()/i\    @android.annotation.SuppressLint("UnspecifiedRegisterReceiverFlag")' TevkilRadar/app/src/main/java/com/tevkil/radar/MainActivity.java
      - name: Apply Android compatibility fixes to extracted source
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          styles=Path('TevkilRadar/app/src/main/res/values/styles.xml')
          s=styles.read_text()
          if 'android:windowLightNavigationBar' not in s:
              raise SystemExit('Expected legacy navigation bar item was not found')
          s=re.sub(r'(?m)^\\s*<item name="android:windowLightNavigationBar">[^<]*</item>\\s*        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK API 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Test matching engine
        run: |
          cd TevkilRadar
          mkdir -p tests/build
          javac -encoding UTF-8 -d tests/build app/src/main/java/com/tevkil/radar/FilterEngine.java tests/FilterEngineTest.java
          java -cp tests/build FilterEngineTest
      - name: Assemble installable APK
        run: cd TevkilRadar && gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Android lint analysis
        run: cd TevkilRadar && gradle :app:lintDebug --no-daemon
      - name: Report Android lint findings
        if: always()
        run: |
          report=TevkilRadar/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if [ -f "$report" ]; then cat "$report"; fi
      - name: Publish Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TevkilRadari-LintReport
          path: TevkilRadar/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: TevkilRadari-APK
          path: TevkilRadar/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
, '\\n', s, count=1)
          styles.write_text(s)
          java=Path('TevkilRadar/app/src/main/java/com/tevkil/radar/MainActivity.java')
          source=java.read_text()
          pattern=r'(?m)^(?P<indent>[ \\t]*)registerReceiver\\s*\\(\\s*refreshReceiver\\s*,\\s*(?P<args>[^;]*?)\\s*\\);'
          match=re.search(pattern,source)
          if not match:
              raise SystemExit('Expected refreshReceiver registration not found')
          indent,args=match.group('indent'),match.group('args')
          replacement=(indent+'if (android.os.Build.VERSION.SDK_INT >= 33) {\\n'
            +indent+'    registerReceiver(refreshReceiver, '+args+', android.content.Context.RECEIVER_NOT_EXPORTED);\\n'
            +indent+'} else {\\n'
            +indent+'    registerReceiver(refreshReceiver, '+args+');\\n'
            +indent+'}')
          source=source[:match.start()]+replacement+source[match.end():]
          java.write_text(source)
          PY
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK API 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Test matching engine
        run: |
          cd TevkilRadar
          mkdir -p tests/build
          javac -encoding UTF-8 -d tests/build app/src/main/java/com/tevkil/radar/FilterEngine.java tests/FilterEngineTest.java
          java -cp tests/build FilterEngineTest
      - name: Assemble installable APK
        run: cd TevkilRadar && gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Android lint analysis
        continue-on-error: true
        run: cd TevkilRadar && gradle :app:lintDebug --no-daemon
      - name: Report Android lint findings
        if: always()
        run: |
          report=TevkilRadar/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if [ -f "$report" ]; then cat "$report"; fi
      - name: Publish Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TevkilRadari-LintReport
          path: TevkilRadar/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: TevkilRadari-APK
          path: TevkilRadar/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
