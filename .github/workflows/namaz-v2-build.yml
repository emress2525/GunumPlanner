name: Namaz V2 Full Verification

on:
  push:
    branches: [ namaz-v2-build ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reassemble verified full source
        working-directory: NamazV2
        run: |
          set -euo pipefail
          cat source.part00 source.part01 source.part02 source.part03 source.part04 source.part05 source.part06 source.part07 source.part08 source.part09 source.part10 source.part11 > source-full.tar.gz
          echo "710b80a4db2a7a65287c4e3721b75df2a02708dd6318b54293ea631aab7cfaae  source-full.tar.gz" | sha256sum -c -
          rm -rf app build.gradle settings.gradle gradle.properties
          tar -xzf source-full.tar.gz -C .
          sed -i 's/android.useAndroidX=false/android.useAndroidX=true/' gradle.properties
          sed -i 's/\.setMinHeight(/.setMinimumHeight(/g' app/src/main/java/com/namazv2/app/MainActivity.java
          grep -q '^android.useAndroidX=true$' gradle.properties
          ! grep -q '\.setMinHeight(' app/src/main/java/com/namazv2/app/MainActivity.java
          test -f app/src/main/java/com/namazv2/app/MainActivity.java
          test -f app/src/main/java/com/namazv2/billing/BillingManager.java
          test -f app/src/main/java/com/namazv2/data/HadithRepository.java
          test -f app/src/main/java/com/namazv2/widget/PrayerWidgetProvider.java
          test -f app/src/test/java/com/namazv2/core/AdvancedCoreLogicTest.java

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Ensure Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Fetch licensed Tanzil Quran text
        working-directory: NamazV2
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/acfatah/tanzil/052b515f3a24dfacbe4cafc3b89f0681a447f462/data/quran-uthmani.txt" \
            -o app/src/main/assets/quran-uthmani.txt
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/acfatah/tanzil/052b515f3a24dfacbe4cafc3b89f0681a447f462/LICENSE" \
            -o app/src/main/assets/TANZIL_LICENSE.txt
          test "$(grep -v '^#' app/src/main/assets/quran-uthmani.txt | grep -c '[^[:space:]]')" -ge 6200
          grep -q "Tanzil" app/src/main/assets/TANZIL_LICENSE.txt

      - name: Core contract tests
        working-directory: NamazV2
        run: gradle --no-daemon testDebugUnitTest --tests com.namazv2.core.AdvancedCoreLogicTest

      - name: Android unit tests
        working-directory: NamazV2
        run: gradle --no-daemon testDebugUnitTest

      - name: Android lint
        working-directory: NamazV2
        run: gradle --no-daemon lintDebug

      - name: Build debug APK
        working-directory: NamazV2
        run: gradle --no-daemon assembleDebug

      - name: Build release AAB candidate
        working-directory: NamazV2
        run: |
          gradle --no-daemon bundleRelease
          test -s app/build/outputs/bundle/release/app-release.aab

      - name: Verify APK signature
        working-directory: NamazV2
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk NamazV2-1.0.0-rc1-debug.apk
          cp app/build/outputs/bundle/release/app-release.aab NamazV2-1.0.0-rc1-unsigned.aab
          sha256sum NamazV2-1.0.0-rc1-debug.apk NamazV2-1.0.0-rc1-unsigned.aab | tee artifact-sha256.txt

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Android emulator smoke and UI stress
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r NamazV2/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant com.namazv2.app android.permission.POST_NOTIFICATIONS || true
            adb shell am start -W -n com.namazv2.app/.MainActivity
            sleep 4
            test -n "$(adb shell pidof com.namazv2.app | tr -d '\r')"
            adb logcat -c
            adb shell monkey -p com.namazv2.app --throttle 80 --pct-syskeys 0 --pct-anyevent 0 -v 200
            sleep 3
            test -n "$(adb shell pidof com.namazv2.app | tr -d '\r')"
            adb logcat -d > /tmp/namaz-logcat.txt
            if grep -E "FATAL EXCEPTION|ANR in com\.namazv2\.app" /tmp/namaz-logcat.txt; then
              cat /tmp/namaz-logcat.txt
              exit 1
            fi

      - name: Upload verified installable APK
        uses: actions/upload-artifact@v4
        with:
          name: NamazV2-Full-APK
          path: |
            NamazV2/NamazV2-1.0.0-rc1-debug.apk
            NamazV2/artifact-sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload release AAB candidate
        uses: actions/upload-artifact@v4
        with:
          name: NamazV2-AAB-Candidate
          path: NamazV2/NamazV2-1.0.0-rc1-unsigned.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NamazV2-Full-Source
          path: |
            NamazV2/app
            NamazV2/build.gradle
            NamazV2/settings.gradle
            NamazV2/gradle.properties
          if-no-files-found: warn
          retention-days: 7
