name: Namaz V2 Android Build

on:
  push:
    branches: [ namaz-v2-build ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NamazV2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reassemble and unpack Namaz V2 source
        run: |
          cat source.part00 source.part01 source.part02 source.part03 > source-good.tar.gz
          echo "45476a9dbf0b9361d672d6c7de8f599df92964d00a4d2246be298203bb1b5e62  source-good.tar.gz" | sha256sum -c -
          tar -xzf source-good.tar.gz -C .
          sed -i 's/date\.atNoon()/date.atTime(12, 0)/' app/src/main/java/com/namazv2/alarm/PrayerAlarmScheduler.java
          grep -q 'date.atTime(12, 0)' app/src/main/java/com/namazv2/alarm/PrayerAlarmScheduler.java
          cp ci-fixed/WebSourceActivity.java app/src/main/java/com/namazv2/app/WebSourceActivity.java

      - name: Upload extracted source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: NamazV2-Source
          path: |
            NamazV2/app
            NamazV2/build.gradle
            NamazV2/settings.gradle
            NamazV2/gradle.properties
          if-no-files-found: error
          retention-days: 7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Ensure Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Fetch licensed Tanzil Quran text
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/acfatah/tanzil/052b515f3a24dfacbe4cafc3b89f0681a447f462/data/quran-uthmani.txt" \
            -o app/src/main/assets/quran-uthmani.txt
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/acfatah/tanzil/052b515f3a24dfacbe4cafc3b89f0681a447f462/LICENSE" \
            -o app/src/main/assets/TANZIL_LICENSE.txt
          test "$(grep -v '^#' app/src/main/assets/quran-uthmani.txt | grep -c '[^[:space:]]')" -ge 6200
          grep -q "Tanzil" app/src/main/assets/TANZIL_LICENSE.txt

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Android lint
        run: gradle --no-daemon lintDebug

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk NamazV2-1.0.0-beta1-debug.apk

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: NamazV2-APK
          path: NamazV2/NamazV2-1.0.0-beta1-debug.apk
          if-no-files-found: error
          retention-days: 30
