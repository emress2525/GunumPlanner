name: Build Namaz V5 APK

on:
  push:
    branches: [ "namaz-clean-rebuild" ]
    paths:
      - "namaz-native/**"
      - ".github/workflows/namaz-native-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: namaz-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Regenerate current known-good Namaz base
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/namaz-build.yml')
          lines=p.read_text(encoding='utf-8').splitlines()
          marker='- name: Generate clean Android project'
          i=next(i for i,l in enumerate(lines) if marker in l)
          i=next(i for i in range(i+1,len(lines)) if lines[i].strip()=='run: |')+1
          out=[]
          while i < len(lines):
              line=lines[i]
              if line.startswith('      - name:'):
                  break
              if line.strip()=='':
                  out.append('')
              else:
                  if not line.startswith('          '):
                      break
                  out.append(line[10:])
              i+=1
          Path('/tmp/generate_namaz.sh').write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
          bash /tmp/generate_namaz.sh
          sed -i "s/applicationId 'app.namaz.tr.clean'/applicationId 'app.namaz.tr.v5'/" namazapp/app/build.gradle
          sed -i "s/versionCode 1/versionCode 5/" namazapp/app/build.gradle
          sed -i "s/versionName '1.0.0'/versionName '5.0.0'/" namazapp/app/build.gradle
          sed -i 's#<string name="app_name">Namaz</string>#<string name="app_name">Namaz V5</string>#' namazapp/app/src/main/res/values/strings.xml
          grep -q "applicationId 'app.namaz.tr.v5'" namazapp/app/build.gradle
          grep -q '<string name="app_name">Namaz V5</string>' namazapp/app/src/main/res/values/strings.xml

      - name: Python patch regression tests
        run: PYTHONPATH=namaz-native python3 -m unittest discover -s namaz-native -p 'test_*.py' -v

      - name: Prepare native overlay and rich V5 UI
        shell: bash
        run: |
          set -euo pipefail
          cat >> namazapp/app/build.gradle <<'GRADLE'
          dependencies { testImplementation 'junit:junit:4.13.2' }
          GRADLE
          cp -R namaz-native/overlay/app/src/. namazapp/app/src/
          python3 namaz-native/patch_assets.py --apply namazapp
          python3 namaz-native/widget_ayah_patch.py namazapp
          python3 namaz-native/patch_assets.py --self-test namazapp
          python3 namaz-native/market_upgrade.py --apply namazapp
          python3 namaz-native/market_upgrade.py --self-test namazapp
          python3 namaz-native/book_expansion.py --apply namazapp
          python3 namaz-native/book_expansion.py --self-test namazapp
          python3 namaz-native/v5_upgrade.py --apply namazapp
          python3 namaz-native/v5_upgrade.py --self-test namazapp
          python3 - <<'PY'
          from pathlib import Path
          p=Path('namazapp/app/src/main/res/layout/prayer_widget.xml')
          text=p.read_text(encoding='utf-8')
          text=text.replace('☾  Namaz','☾  Namaz V5',1)
          p.write_text(text,encoding='utf-8')
          if '☾  Namaz V5' not in text:
              raise SystemExit('widget V5 brand marker missing')
          PY
          grep -q 'AndroidBridge.updateAyah' namazapp/app/src/main/assets/app.js
          grep -q 'id="namazHocasi"' namazapp/app/src/main/assets/index.html
          grep -q 'id="learn"' namazapp/app/src/main/assets/index.html
          grep -q 'NAMAZ V5' namazapp/app/src/main/assets/index.html
          grep -q 'Sıfırdan Namaz Öğren' namazapp/app/src/main/assets/index.html
          grep -q 'Aile ve anne-baba' namazapp/app/src/main/assets/index.html
          grep -q '32 Farz Öğretim Şeması' namazapp/app/src/main/assets/index.html
          grep -q 'widgetTracker' namazapp/app/src/main/res/layout/prayer_widget.xml
          grep -q '☾  Namaz V5' namazapp/app/src/main/res/layout/prayer_widget.xml
          mkdir -p namazapp/app/src/main/res/raw
          python3 - <<'PY'
          import base64, json, urllib.request
          from pathlib import Path
          url='https://api.github.com/repos/Kiwifu/adhan-mp3/git/blobs/646ec7dc2732831abd899a52d785b10516769faa'
          req=urllib.request.Request(url,headers={'User-Agent':'Namaz-App-Build'})
          with urllib.request.urlopen(req,timeout=30) as r:
              data=json.load(r)
          audio=base64.b64decode(data['content'])
          out=Path('namazapp/app/src/main/res/raw/adhan.mp3')
          out.write_bytes(audio)
          if len(audio) < 100000:
              raise SystemExit('adhan audio unexpectedly small')
          PY

      - name: Unit tests
        run: gradle -p namazapp testDebugUnitTest --stacktrace

      - name: Assemble APK
        run: gradle -p namazapp assembleDebug --stacktrace

      - name: Verify APK signature, package and rich content
        shell: bash
        run: |
          set -euo pipefail
          APK=namazapp/app/build/outputs/apk/debug/app-debug.apk
          ${ANDROID_HOME}/build-tools/35.0.0/apksigner verify --verbose "$APK"
          unzip -t "$APK" >/dev/null
          ${ANDROID_HOME}/build-tools/35.0.0/aapt dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='app.namaz.tr.v5' versionCode='5' versionName='5.0.0'" /tmp/badging.txt
          grep -q "application-label:'Namaz V5'" /tmp/badging.txt
          unzip -l "$APK" | grep -q 'res/raw/adhan.mp3'
          unzip -p "$APK" assets/index.html > /tmp/namaz-index.html
          grep -q 'NAMAZ V5' /tmp/namaz-index.html
          grep -q 'Sıfırdan Namaz Öğren' /tmp/namaz-index.html
          grep -q 'Abdest: adım adım' /tmp/namaz-index.html
          grep -q 'Gıybet' /tmp/namaz-index.html
          grep -q 'data-s="learn"' /tmp/namaz-index.html
          cp "$APK" Namaz-V5.apk
          sha256sum Namaz-V5.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Namaz-V5-APK
          path: Namaz-V5.apk
          if-no-files-found: error
