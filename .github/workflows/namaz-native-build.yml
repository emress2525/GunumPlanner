name: Build Namaz V7 APK

on:
  push:
    branches: [ "namaz-clean-rebuild" ]
    paths:
      - "namaz-native/**"
      - ".github/workflows/namaz-native-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: namaz-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Regenerate current known-good Namaz base
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/namaz-build.yml')
          lines=p.read_text(encoding='utf-8').splitlines()
          marker='- name: Generate clean Android project'
          i=next(i for i,l in enumerate(lines) if marker in l)
          i=next(i for i in range(i+1,len(lines)) if lines[i].strip()=='run: |')+1
          out=[]
          while i < len(lines):
              line=lines[i]
              if line.startswith('      - name:'):
                  break
              if line.strip()=='': out.append('')
              elif line.startswith('          '): out.append(line[10:])
              else: break
              i+=1
          Path('/tmp/generate_namaz.sh').write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
          bash /tmp/generate_namaz.sh
          sed -i "s/applicationId 'app.namaz.tr.clean'/applicationId 'app.namaz.tr.v7'/" namazapp/app/build.gradle
          sed -i "s/versionCode 1/versionCode 7/" namazapp/app/build.gradle
          sed -i "s/versionName '1.0.0'/versionName '7.0.0'/" namazapp/app/build.gradle
          sed -i 's#<string name="app_name">Namaz</string>#<string name="app_name">Namaz V7</string>#' namazapp/app/src/main/res/values/strings.xml
          grep -q "applicationId 'app.namaz.tr.v7'" namazapp/app/build.gradle
          grep -q 'versionCode 7' namazapp/app/build.gradle
          grep -q "versionName '7.0.0'" namazapp/app/build.gradle

      - name: Python regression tests
        run: PYTHONPATH=namaz-native python3 -m unittest discover -s namaz-native -p 'test_*.py' -v

      - name: Apply native overlay and feature patches
        shell: bash
        run: |
          set -euo pipefail
          cat >> namazapp/app/build.gradle <<'GRADLE'
          dependencies { testImplementation 'junit:junit:4.13.2' }
          GRADLE
          cp -R namaz-native/overlay/app/src/. namazapp/app/src/
          python3 namaz-native/patch_assets.py --apply namazapp
          python3 namaz-native/widget_ayah_patch.py namazapp
          python3 namaz-native/patch_assets.py --self-test namazapp
          python3 namaz-native/market_upgrade.py --apply namazapp
          python3 namaz-native/market_upgrade.py --self-test namazapp
          python3 namaz-native/book_expansion.py --apply namazapp
          python3 namaz-native/book_expansion.py --self-test namazapp
          python3 namaz-native/v5_upgrade.py --apply namazapp
          python3 namaz-native/v5_upgrade.py --self-test namazapp

      - name: Apply and self-test V6 academy content
        shell: bash
        run: |
          set -euo pipefail
          python3 namaz-native/v6_academy.py --apply namazapp
          python3 namaz-native/v6_academy.py --self-test namazapp
          test -s namazapp/app/src/main/assets/academy/academy-data.js
          test -s namazapp/app/src/main/assets/academy/lessons-hanafi.js
          test -s namazapp/app/src/main/assets/academy/lessons-shafii-notes.js
          test -s namazapp/app/src/main/assets/academy/academy.js
          test -s namazapp/app/src/main/assets/academy/academy.css

      - name: Apply V7 widget and lock-screen layer
        shell: bash
        run: |
          set -euo pipefail
          python3 namaz-native/v7_upgrade.py --apply namazapp
          python3 namaz-native/v7_upgrade.py --self-test namazapp
          grep -q '<string name="app_name">Namaz V7</string>' namazapp/app/src/main/res/values/strings.xml
          grep -q 'NextPrayerWidgetProvider' namazapp/app/src/main/AndroidManifest.xml
          grep -q 'QuranResumeWidgetProvider' namazapp/app/src/main/AndroidManifest.xml
          grep -q 'id="prayerStatus"' namazapp/app/src/main/assets/index.html
          grep -q 'AndroidBridge.setPrayerStatusEnabled' namazapp/app/src/main/assets/app.js
          grep -q 'resume:' namazapp/app/src/main/assets/app.js

      - name: Verify Javascript and academy routing
        shell: bash
        run: |
          set -euo pipefail
          node --check namazapp/app/src/main/assets/app.js
          node --check namazapp/app/src/main/assets/core.js
          node --check namazapp/app/src/main/assets/academy/academy-data.js
          node --check namazapp/app/src/main/assets/academy/lessons-hanafi.js
          node --check namazapp/app/src/main/assets/academy/lessons-shafii-notes.js
          node --check namazapp/app/src/main/assets/academy/academy.js
          grep -q 'id="academyRoot"' namazapp/app/src/main/assets/index.html
          grep -q 'Namaz Akademisi' namazapp/app/src/main/assets/index.html
          grep -q 'data-s="learn"' namazapp/app/src/main/assets/index.html
          grep -q 'academyHandleAndroidBack' namazapp/app/src/main/assets/academy/academy.js
          grep -q 'sabah-namazi' namazapp/app/src/main/assets/academy/academy-data.js
          grep -q 'yatsi-namazi' namazapp/app/src/main/assets/academy/academy-data.js
          grep -q 'Şafiî' namazapp/app/src/main/assets/academy/lessons-shafii-notes.js
          grep -q 'sources:' namazapp/app/src/main/assets/academy/lessons-hanafi.js

      - name: Fetch verified adhan audio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p namazapp/app/src/main/res/raw
          ADHAN_URL='https://raw.githubusercontent.com/Kiwifu/adhan-mp3/main/Adhan_Turkey_1_(%D8%A3%D8%B0%D8%A7%D9%86_%D8%AA%D8%B1%D9%83%D9%8A%D8%A7).mp3'
          curl -fL --retry 3 --retry-delay 2 --connect-timeout 20 "$ADHAN_URL" -o namazapp/app/src/main/res/raw/adhan.mp3
          python3 - <<'PY'
          from pathlib import Path
          p=Path('namazapp/app/src/main/res/raw/adhan.mp3')
          if p.stat().st_size < 100000:
              raise SystemExit('adhan audio unexpectedly small')
          PY

      - name: Unit tests
        run: gradle -p namazapp testDebugUnitTest --stacktrace

      - name: Assemble APK
        run: gradle -p namazapp assembleDebug --stacktrace

      - name: Verify APK signature package widgets and academy content
        shell: bash
        run: |
          set -euo pipefail
          APK=namazapp/app/build/outputs/apk/debug/app-debug.apk
          cp "$APK" Namaz-V7.apk
          ${ANDROID_HOME}/build-tools/35.0.0/apksigner verify --verbose Namaz-V7.apk
          unzip -t Namaz-V7.apk >/dev/null
          ${ANDROID_HOME}/build-tools/35.0.0/aapt dump badging Namaz-V7.apk | tee /tmp/badging.txt
          grep -q "package: name='app.namaz.tr.v7' versionCode='7' versionName='7.0.0'" /tmp/badging.txt
          grep -q "application-label:'Namaz V7'" /tmp/badging.txt
          ${ANDROID_HOME}/build-tools/35.0.0/aapt dump xmltree Namaz-V7.apk AndroidManifest.xml > /tmp/manifest-tree.txt
          for c in NextPrayerWidgetProvider CountdownWidgetProvider PrayerTimesWidgetProvider PrayerTrackerWidgetProvider DailyAyahWidgetProvider HijriDateWidgetProvider QuranResumeWidgetProvider; do grep -q "$c" /tmp/manifest-tree.txt; done
          for f in widget_next_prayer.xml widget_countdown.xml widget_prayer_times.xml widget_tracker.xml widget_daily_ayah.xml widget_hijri.xml widget_quran_resume.xml; do unzip -l Namaz-V7.apk | grep -q "res/layout/$f"; done
          for f in widget_next_prayer_info.xml widget_countdown_info.xml widget_prayer_times_info.xml widget_tracker_info.xml widget_daily_ayah_info.xml widget_hijri_info.xml widget_quran_resume_info.xml; do unzip -l Namaz-V7.apk | grep -q "res/xml/$f"; done
          unzip -l Namaz-V7.apk | grep -q 'res/raw/adhan.mp3'
          unzip -l Namaz-V7.apk | grep -q 'assets/academy/academy-data.js'
          unzip -l Namaz-V7.apk | grep -q 'assets/academy/lessons-hanafi.js'
          unzip -l Namaz-V7.apk | grep -q 'assets/academy/lessons-shafii-notes.js'
          unzip -l Namaz-V7.apk | grep -q 'assets/academy/academy.js'
          unzip -l Namaz-V7.apk | grep -q 'assets/academy/academy.css'
          unzip -p Namaz-V7.apk assets/index.html | grep -q 'Namaz Akademisi'
          sha256sum Namaz-V7.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Namaz-V7-APK
          path: Namaz-V7.apk
          if-no-files-found: error
