name: Build Namaz V6 APK

on:
  push:
    branches: [ "namaz-clean-rebuild" ]
    paths:
      - "namaz-native/**"
      - ".github/workflows/namaz-native-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: namaz-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Regenerate current known-good Namaz base
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/namaz-build.yml')
          lines=p.read_text(encoding='utf-8').splitlines()
          marker='- name: Generate clean Android project'
          i=next(i for i,l in enumerate(lines) if marker in l)
          i=next(i for i in range(i+1,len(lines)) if lines[i].strip()=='run: |')+1
          out=[]
          while i < len(lines):
              line=lines[i]
              if line.startswith('      - name:'):
                  break
              if line.strip()=='':
                  out.append('')
              else:
                  if not line.startswith('          '):
                      break
                  out.append(line[10:])
              i+=1
          Path('/tmp/generate_namaz.sh').write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
          bash /tmp/generate_namaz.sh
          sed -i "s/applicationId 'app.namaz.tr.clean'/applicationId 'app.namaz.tr.v6'/" namazapp/app/build.gradle
          sed -i "s/versionCode 1/versionCode 6/" namazapp/app/build.gradle
          sed -i "s/versionName '1.0.0'/versionName '6.0.0'/" namazapp/app/build.gradle
          sed -i 's#<string name="app_name">Namaz</string>#<string name="app_name">Namaz V6</string>#' namazapp/app/src/main/res/values/strings.xml
          grep -q "applicationId 'app.namaz.tr.v6'" namazapp/app/build.gradle
          grep -q 'versionCode 6' namazapp/app/build.gradle
          grep -q "versionName '6.0.0'" namazapp/app/build.gradle
          grep -q '<string name="app_name">Namaz V6</string>' namazapp/app/src/main/res/values/strings.xml

      - name: Python patch regression tests
        run: PYTHONPATH=namaz-native python3 -m unittest discover -s namaz-native -p 'test_*.py' -v

      - name: Prepare native overlay and rich V6 academy UI
        shell: bash
        run: |
          set -euo pipefail
          cat >> namazapp/app/build.gradle <<'GRADLE'
          dependencies { testImplementation 'junit:junit:4.13.2' }
          GRADLE

          cp -R namaz-native/overlay/app/src/. namazapp/app/src/

          python3 namaz-native/patch_assets.py --apply namazapp
          python3 namaz-native/widget_ayah_patch.py namazapp
          python3 namaz-native/patch_assets.py --self-test namazapp

          python3 namaz-native/market_upgrade.py --apply namazapp
          python3 namaz-native/market_upgrade.py --self-test namazapp

          python3 namaz-native/book_expansion.py --apply namazapp
          python3 namaz-native/book_expansion.py --self-test namazapp

          python3 namaz-native/v5_upgrade.py --apply namazapp
          python3 namaz-native/v5_upgrade.py --self-test namazapp

          python3 namaz-native/v6_academy.py --apply namazapp
          python3 namaz-native/v6_academy.py --self-test namazapp

          # Overlay and previous patchers must never be allowed to restore an older app identity.
          cat > namazapp/app/src/main/res/values/strings.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Namaz V6</string>
              <string name="widget_description">Namaz vakitlerini, sıradaki namaza kalan süreyi, Hicrî tarihi, günlük ayeti, ibadet takibini ve Namaz Akademisi'ni gösterir.</string>
          </resources>
          XML

          python3 - <<'PY'
          from pathlib import Path
          p=Path('namazapp/app/src/main/res/layout/prayer_widget.xml')
          text=p.read_text(encoding='utf-8')
          text=text.replace('☾  Namaz V5','☾  Namaz V6')
          text=text.replace('☾  Namaz</', '☾  Namaz V6</')
          p.write_text(text,encoding='utf-8')
          if '☾  Namaz V6' not in text:
              raise SystemExit('widget V6 brand marker missing')
          PY

          node --check namazapp/app/src/main/assets/app.js
          node --check namazapp/app/src/main/assets/core.js
          node --check namazapp/app/src/main/assets/academy/academy-data.js
          node --check namazapp/app/src/main/assets/academy/lessons-hanafi.js
          node --check namazapp/app/src/main/assets/academy/lessons-shafii-notes.js
          node --check namazapp/app/src/main/assets/academy/academy.js

          grep -q 'AndroidBridge.updateAyah' namazapp/app/src/main/assets/app.js
          grep -q 'id="academyRoot"' namazapp/app/src/main/assets/index.html
          grep -q 'NAMAZ V6' namazapp/app/src/main/assets/index.html
          grep -q 'Namaz Akademisi' namazapp/app/src/main/assets/index.html
          grep -q 'data-s="learn"' namazapp/app/src/main/assets/index.html
          grep -q 'academyHandleAndroidBack' namazapp/app/src/main/assets/academy/academy.js
          grep -q 'sabah-namazi' namazapp/app/src/main/assets/academy/academy-data.js
          grep -q 'ogle-namazi' namazapp/app/src/main/assets/academy/academy-data.js
          grep -q 'ikindi-namazi' namazapp/app/src/main/assets/academy/academy-data.js
          grep -q 'aksam-namazi' namazapp/app/src/main/assets/academy/academy-data.js
          grep -q 'yatsi-namazi' namazapp/app/src/main/assets/academy/academy-data.js
          grep -q 'Şafiî' namazapp/app/src/main/assets/academy/lessons-shafii-notes.js
          grep -q 'sources:' namazapp/app/src/main/assets/academy/lessons-hanafi.js
          grep -q '<string name="app_name">Namaz V6</string>' namazapp/app/src/main/res/values/strings.xml
          grep -q '☾  Namaz V6' namazapp/app/src/main/res/layout/prayer_widget.xml

          for f in \
            namazapp/app/src/main/assets/academy/academy-data.js \
            namazapp/app/src/main/assets/academy/lessons-hanafi.js \
            namazapp/app/src/main/assets/academy/lessons-shafii-notes.js \
            namazapp/app/src/main/assets/academy/academy.js \
            namazapp/app/src/main/assets/academy/academy.css; do
              test -s "$f"
          done

          mkdir -p namazapp/app/src/main/res/raw
          python3 - <<'PY'
          import base64, json, urllib.request
          from pathlib import Path
          url='https://api.github.com/repos/Kiwifu/adhan-mp3/git/blobs/646ec7dc2732831abd899a52d785b10516769faa'
          req=urllib.request.Request(url,headers={'User-Agent':'Namaz-App-Build'})
          with urllib.request.urlopen(req,timeout=30) as r:
              data=json.load(r)
          audio=base64.b64decode(data['content'])
          out=Path('namazapp/app/src/main/res/raw/adhan.mp3')
          out.write_bytes(audio)
          if len(audio) < 100000:
              raise SystemExit('adhan audio unexpectedly small')
          PY

      - name: Unit tests
        run: gradle -p namazapp testDebugUnitTest --stacktrace

      - name: Assemble APK
        run: gradle -p namazapp assembleDebug --stacktrace

      - name: Verify APK signature, package and V6 academy content
        shell: bash
        run: |
          set -euo pipefail
          APK=namazapp/app/build/outputs/apk/debug/app-debug.apk
          cp "$APK" Namaz-V6.apk

          ${ANDROID_HOME}/build-tools/35.0.0/apksigner verify --verbose Namaz-V6.apk
          unzip -t Namaz-V6.apk >/dev/null
          ${ANDROID_HOME}/build-tools/35.0.0/aapt dump badging Namaz-V6.apk | tee /tmp/badging.txt
          grep -q "package: name='app.namaz.tr.v6' versionCode='6' versionName='6.0.0'" /tmp/badging.txt
          grep -q "application-label:'Namaz V6'" /tmp/badging.txt

          unzip -l Namaz-V6.apk | grep -q 'res/raw/adhan.mp3'
          unzip -l Namaz-V6.apk | grep -q 'assets/academy/academy-data.js'
          unzip -l Namaz-V6.apk | grep -q 'assets/academy/lessons-hanafi.js'
          unzip -l Namaz-V6.apk | grep -q 'assets/academy/lessons-shafii-notes.js'
          unzip -l Namaz-V6.apk | grep -q 'assets/academy/academy.js'
          unzip -l Namaz-V6.apk | grep -q 'assets/academy/academy.css'

          unzip -p Namaz-V6.apk assets/index.html > /tmp/namaz-index.html
          unzip -p Namaz-V6.apk assets/academy/academy-data.js > /tmp/academy-data.js
          unzip -p Namaz-V6.apk assets/academy/lessons-hanafi.js > /tmp/lessons-hanafi.js
          unzip -p Namaz-V6.apk assets/academy/lessons-shafii-notes.js > /tmp/lessons-shafii.js
          unzip -p Namaz-V6.apk assets/academy/academy.js > /tmp/academy.js

          grep -q 'id="academyRoot"' /tmp/namaz-index.html
          grep -q 'Namaz Akademisi' /tmp/namaz-index.html
          grep -q 'sabah-namazi' /tmp/academy-data.js
          grep -q 'ogle-namazi' /tmp/academy-data.js
          grep -q 'ikindi-namazi' /tmp/academy-data.js
          grep -q 'aksam-namazi' /tmp/academy-data.js
          grep -q 'yatsi-namazi' /tmp/academy-data.js
          grep -q '32-farz' /tmp/academy-data.js
          grep -q 'abdest' /tmp/academy-data.js
          grep -q 'mahremiyet-sosyal-medya' /tmp/academy-data.js
          grep -q 'Şafiî' /tmp/lessons-shafii.js
          grep -q 'sources:' /tmp/lessons-hanafi.js
          grep -q 'academyHandleAndroidBack' /tmp/academy.js
          ! grep -q "show('knowledge')" /tmp/academy.js
          ! grep -q "show('duas')" /tmp/academy.js
          ! grep -q "show('namazHocasi')" /tmp/academy.js

          sha256sum Namaz-V6.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Namaz-V6-APK
          path: Namaz-V6.apk
          if-no-files-found: error
