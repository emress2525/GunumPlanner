name: Build Namaz Native APK

on:
  push:
    branches: [ "namaz-clean-rebuild" ]
    paths:
      - "namaz-native/**"
      - ".github/workflows/namaz-native-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Regenerate current known-good Namaz base
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/namaz-build.yml')
          lines=p.read_text(encoding='utf-8').splitlines()
          marker='- name: Generate clean Android project'
          i=next(i for i,l in enumerate(lines) if marker in l)
          i=next(i for i in range(i+1,len(lines)) if lines[i].strip()=='run: |')+1
          out=[]
          while i < len(lines):
              line=lines[i]
              if line.startswith('      - name:'):
                  break
              if line.strip()=='' :
                  out.append('')
              else:
                  if not line.startswith('          '):
                      break
                  out.append(line[10:])
              i+=1
          Path('/tmp/generate_namaz.sh').write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
          bash /tmp/generate_namaz.sh

      - name: Python patch regression tests
        run: PYTHONPATH=namaz-native python3 -m unittest discover -s namaz-native -p 'test_*.py' -v

      - name: Prepare test dependencies and overlay
        shell: bash
        run: |
          set -euo pipefail
          cat >> namazapp/app/build.gradle <<'GRADLE'
          dependencies { testImplementation 'junit:junit:4.13.2' }
          GRADLE
          if [ -d namaz-native/overlay/app/src ]; then
            cp -R namaz-native/overlay/app/src/. namazapp/app/src/
          fi
          if [ -f namaz-native/patch_assets.py ]; then
            python3 namaz-native/patch_assets.py --apply namazapp
            python3 namaz-native/patch_assets.py --self-test namazapp
          fi

      - name: Unit tests
        run: gradle -p namazapp testDebugUnitTest --stacktrace

      - name: Assemble APK
        run: gradle -p namazapp assembleDebug --stacktrace

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          ${ANDROID_HOME}/build-tools/35.0.0/apksigner verify --verbose namazapp/app/build/outputs/apk/debug/app-debug.apk
          unzip -t namazapp/app/build/outputs/apk/debug/app-debug.apk >/dev/null
          cp namazapp/app/build/outputs/apk/debug/app-debug.apk Namaz.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Namaz-APK
          path: Namaz.apk
          if-no-files-found: error
