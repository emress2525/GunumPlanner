name: Vocal Isolator Speed APK

on:
  push:
    branches: [ "vocal-isolator-build" ]
    paths:
      - ".github/workflows/vocal-isolator-speed.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Verify APK
        shell: bash
        run: |
          APK="vocal-isolator-build/project/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          BT="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --verbose "$APK"
          sha256sum "$APK" | tee "$APK.sha256"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VocalIsolator-speed-apk
          path: |
            vocal-isolator-build/project/app/build/outputs/apk/debug/app-debug.apk
            vocal-isolator-build/project/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 3
