name: Build Android APK

on:
  push:
    branches: [ "main", "premium-v1", "premium-v2", "premium-v3", "premium-v4-full" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Integrate premium v3 extras
        if: github.ref == 'refs/heads/premium-v3' || github.ref == 'refs/heads/premium-v4-full'
        run: |
          python3 scripts/patch_extras.py
          python3 scripts/patch_map_picker.py

      - name: Integrate full premium v4 features
        if: github.ref == 'refs/heads/premium-v4-full'
        run: |
          python3 scripts/patch_full.py
          python3 scripts/patch_map_layout_fix.py
          python3 scripts/patch_inline_subtasks.py

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GunumPlanner-premium-v4.4-inline-subtasks-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
