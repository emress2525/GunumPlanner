name: Build Android APK

on:
  push:
    branches: [ "main", "premium-v1" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Normalize premium Kotlin source
        run: |
          python3 - <<'PY'
          p = 'app/src/main/java/com/emre/gunumplanner/PremiumMainActivity.kt'
          s = open(p, encoding='utf-8').read()
          s = s.replace('@Composable fun PremiumTheme(c:@Composable()->Unit)', '@Composable fun PremiumTheme(c: @Composable () -> Unit)')
          open(p, 'w', encoding='utf-8').write(s)
          PY

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GunumPlanner-premium-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
