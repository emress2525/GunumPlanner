name: Unified AI Android APK

on:
  push:
    branches: [unified-ai-build-temp]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout temporary build branch
        uses: actions/checkout@v4

      - name: Reconstruct verified source
        shell: bash
        run: |
          set -euo pipefail
          cat unified-ai-fixed/part00-00.b64 unified-ai-fixed/part00-01.b64 unified-ai-fixed/part00-02.b64 unified-ai-fixed/part00-03.b64 unified-ai-fixed/part00-04.b64 unified-ai-fixed/part00-05.b64 unified-ai-fixed/part00-06.b64 unified-ai-fixed/part00-07.b64 unified-ai-fixed/part00-08.b64 > /tmp/part00.b64
          echo '321edaed884eecd31cd99cff2b8732a815e528c2cf4f4944c0ab2fe6a85923f9  /tmp/part00.b64' | sha256sum -c -
          cat /tmp/part00.b64 unified-ai-parts/part01.b64 unified-ai-parts/part02.b64 unified-ai-parts/part03.b64 unified-ai-parts/part04.b64 unified-ai-parts/part050.b64 unified-ai-parts/part051.b64 unified-ai-parts/part052.b64 unified-ai-parts/part053.b64 unified-ai-parts/part054.b64 unified-ai-parts/part055.b64 > /tmp/unified-ai-source.b64
          base64 --decode /tmp/unified-ai-source.b64 > /tmp/unified-ai-source.zip
          echo 'fba7443946a842a6b7ea331c75a216da022b87dcc340aee9c1d8d9961c037d26  /tmp/unified-ai-source.zip' | sha256sum -c -
          rm -rf unified-ai-app && mkdir unified-ai-app
          unzip -q /tmp/unified-ai-source.zip -d unified-ai-app
          cp unified-ai-patches/libs.versions.toml unified-ai-app/gradle/libs.versions.toml
          cp unified-ai-patches/app-build.gradle.kts unified-ai-app/app/build.gradle.kts
          cp unified-ai-patches/ChatViewModelTest.kt unified-ai-app/app/src/test/java/com/unifiedai/app/feature/chat/ChatViewModelTest.kt
          test "$(git hash-object unified-ai-fix2.tar.gz)" = "4e998f9d4edfcc5026a8c8066a127bfac8522209"
          tar -xzf unified-ai-fix2.tar.gz -C unified-ai-app
          cp unified-ai-patches/OnDeviceProviderTest.kt unified-ai-app/app/src/test/java/com/unifiedai/app/data/provider/ondevice/OnDeviceProviderTest.kt
          cat unified-ai-current-patch/part00.b64 unified-ai-current-patch/part01.b64 unified-ai-current-patch/part02.b64 unified-ai-current-patch/part03-00.b64 unified-ai-current-patch/part03-01.b64 unified-ai-current-patch/part03-02.b64 unified-ai-current-patch/part03-03.b64 unified-ai-current-patch/part03-04.b64 > /tmp/current-phone-local-patch.b64
          base64 --decode /tmp/current-phone-local-patch.b64 > /tmp/current-phone-local-patch.zip
          echo '51a1d522f5dba4ba03d97efa4e7035ef0940ce681955a145d15d424ba3c8c741  /tmp/current-phone-local-patch.zip' | sha256sum -c -
          unzip -qo /tmp/current-phone-local-patch.zip -d unified-ai-app

      - name: Apply blank URL fix and regression tests
        shell: bash
        run: |
          set -euo pipefail
          cp unified-ai-patches/ProviderFactory-fixed.kt unified-ai-app/app/src/main/java/com/unifiedai/app/data/provider/cloud/ProviderFactory.kt
          cp unified-ai-patches/SettingsViewModel-fixed.kt unified-ai-app/app/src/main/java/com/unifiedai/app/feature/settings/SettingsViewModel.kt
          mkdir -p unified-ai-app/app/src/test/java/com/unifiedai/app/data/provider/cloud
          cp unified-ai-patches/ProviderFactoryUrlTest.kt unified-ai-app/app/src/test/java/com/unifiedai/app/data/provider/cloud/ProviderFactoryUrlTest.kt
          mkdir -p unified-ai-app/app/src/test/java/com/unifiedai/app/data/provider/local
          cp unified-ai-patches/ResumableModelDownloaderTest.kt unified-ai-app/app/src/test/java/com/unifiedai/app/data/provider/local/ResumableModelDownloaderTest.kt
          grep -Fq 'ollamaBaseUrlOrNull(settings.ollamaUrl)' unified-ai-app/app/src/main/java/com/unifiedai/app/data/provider/cloud/ProviderFactory.kt
          grep -Fq 'toHttpUrlOrNull' unified-ai-app/app/src/main/java/com/unifiedai/app/data/provider/cloud/ProviderFactory.kt
          ! grep -Fq 'settings.ollamaUrl.toHttpUrl()' unified-ai-app/app/src/main/java/com/unifiedai/app/data/provider/cloud/ProviderFactory.kt
          grep -Fq 'Ollama adresi http:// veya https:// ile başlamalı.' unified-ai-app/app/src/main/java/com/unifiedai/app/feature/settings/SettingsViewModel.kt
          grep -Fq 'TextButton(onClick = onOpenSettings) { Text("Modeli kur") }' unified-ai-app/app/src/main/java/com/unifiedai/app/feature/chat/ChatScreen.kt
          grep -Fq 'Button(onClick = viewModel::downloadLocalModel) { Text("Yerel modeli indir") }' unified-ai-app/app/src/main/java/com/unifiedai/app/feature/settings/SettingsScreen.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: RED - zero-byte model download regression
        working-directory: unified-ai-app
        run: gradle :app:testDebugUnitTest --tests com.unifiedai.app.data.provider.local.ResumableModelDownloaderTest --stacktrace

      - name: GREEN - blank Ollama URL regression test
        working-directory: unified-ai-app
        run: gradle :app:testDebugUnitTest --tests com.unifiedai.app.data.provider.cloud.ProviderFactoryUrlTest --stacktrace

      - name: Lint and full unit tests
        working-directory: unified-ai-app
        run: gradle :app:lintDebug :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        working-directory: unified-ai-app
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK UX and integrity
        shell: bash
        run: |
          set -euo pipefail
          APK='unified-ai-app/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          rm -rf /tmp/apk-dex && mkdir -p /tmp/apk-dex
          unzip -q "$APK" 'classes*.dex' -d /tmp/apk-dex
          strings /tmp/apk-dex/classes*.dex > /tmp/apk-strings.txt
          grep -Fq 'Modeli kur' /tmp/apk-strings.txt
          grep -Fq 'Yerel modeli indir' /tmp/apk-strings.txt
          grep -Fq 'ollamaBaseUrlOrNull' /tmp/apk-strings.txt
          sha256sum "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: unified-ai-phone-local-v0-4-debug-apk
          path: unified-ai-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
