name: Jarvis Source Fix

on:
  push:
    branches: [jarvis-apk-build]
    paths:
      - '.github/workflows/jarvis-source-fix.yml'

permissions:
  contents: write

jobs:
  fix-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jarvis-apk-build
          fetch-depth: 0
      - name: Apply verified compile fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('jarvis-build/app/src/main/java/com/sesliasistan/jarvis/JarvisListeningService.java')
          text = path.read_text(encoding='utf-8')
          old = 'catch (SecurityException | RuntimeException ignored)'
          new = 'catch (RuntimeException ignored)'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one compile-fix target, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git diff --exit-code -- jarvis-build/app/src/main/java/com/sesliasistan/jarvis/JarvisListeningService.java && exit 1 || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jarvis-build/app/src/main/java/com/sesliasistan/jarvis/JarvisListeningService.java
          git commit -m 'fix(jarvis): correct contact resolver exception catch [skip ci]'
          git push origin HEAD:jarvis-apk-build
