name: Expand Tevkil Radar editable source
on:
  push:
    branches: [tevkil-radari-mvp]
    paths:
      - '.github/workflows/expand-tevkil-source.yml'
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Expand existing bundled source into tracked files
        run: |
          tar -xzf TevkilRadar-source.tar.gz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TevkilRadar/
          if ! git diff --cached --quiet; then
            git commit -m "Expose Tevkil Radar source for maintainable updates"
            git push origin HEAD:tevkil-radari-mvp
          fi
