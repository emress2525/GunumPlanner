name: Build Namaz Clean APK

on:
  push:
    branches: [ "namaz-clean-rebuild" ]
    paths: [ ".github/workflows/namaz-build.yml" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate clean Android project
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf namazapp
          mkdir -p namazapp/app/src/main/java/app/namaz/tr
          mkdir -p namazapp/app/src/main/res/values
          mkdir -p namazapp/app/src/main/assets
          cat > namazapp/settings.gradle <<'GRADLE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='NamazClean'
          include ':app'
          GRADLE
          cat > namazapp/build.gradle <<'GRADLE'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          GRADLE
          cat > namazapp/gradle.properties <<'GRADLE'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          GRADLE
          cat > namazapp/app/build.gradle <<'GRADLE'
          plugins { id 'com.android.application' }
          android {
            namespace 'app.namaz.tr'
            compileSdk 35
            defaultConfig {
              applicationId 'app.namaz.tr.clean'
              minSdk 26
              targetSdk 35
              versionCode 1
              versionName '1.0.0'
            }
            buildTypes { debug { minifyEnabled false } }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          GRADLE
          cat > namazapp/app/src/main/AndroidManifest.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.VIBRATE" />
            <application android:allowBackup="true" android:label="@string/app_name" android:supportsRtl="true" android:theme="@style/AppTheme" android:usesCleartextTraffic="false">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          XML
          cat > namazapp/app/src/main/res/values/strings.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><string name="app_name">Namaz</string></resources>
          XML
          cat > namazapp/app/src/main/res/values/themes.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:windowLightStatusBar">false</item>
              <item name="android:statusBarColor">#083F32</item>
              <item name="android:navigationBarColor">#000000</item>
            </style>
          </resources>
          XML
          cat > namazapp/app/src/main/java/app/namaz/tr/MainActivity.java <<'JAVA'
          package app.namaz.tr;
          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.CookieManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
            private WebView webView;
            @SuppressLint("SetJavaScriptEnabled")
            @Override public void onCreate(Bundle state) {
              super.onCreate(state);
              getWindow().setStatusBarColor(Color.rgb(8,63,50));
              getWindow().setNavigationBarColor(Color.BLACK);
              webView=new WebView(this);
              webView.setBackgroundColor(Color.rgb(243,246,242));
              setContentView(webView);
              WebSettings s=webView.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setDatabaseEnabled(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              s.setAllowFileAccess(true);
              s.setAllowContentAccess(true);
              s.setAllowFileAccessFromFileURLs(true);
              s.setAllowUniversalAccessFromFileURLs(true);
              s.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
              CookieManager.getInstance().setAcceptCookie(true);
              CookieManager.getInstance().setAcceptThirdPartyCookies(webView,true);
              webView.setWebChromeClient(new WebChromeClient());
              webView.setWebViewClient(new WebViewClient());
              webView.setOverScrollMode(View.OVER_SCROLL_NEVER);
              webView.loadUrl("file:///android_asset/index.html");
            }
            @Override public void onBackPressed(){ if(webView!=null && webView.canGoBack()) webView.goBack(); else super.onBackPressed(); }
            @Override protected void onDestroy(){ if(webView!=null){ webView.stopLoading(); webView.destroy(); webView=null; } super.onDestroy(); }
          }
          JAVA
          echo '' | base64 -d > /tmp/assets.tgz
          tar -xzf /tmp/assets.tgz -C namazapp/app/src/main/assets
      - name: Build APK
        run: cd namazapp && gradle :app:assembleDebug --stacktrace
      - name: Verify APK
        run: |
          APK="namazapp/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          unzip -t "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: Namaz-clean-apk
          path: namazapp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
