plugins { id 'com.android.application' }
android {
    namespace 'org.afetatlas.offline'
    compileSdk 35
    defaultConfig {
        applicationId 'org.afetatlas.offline.preview'
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName '0.4.0-telefon-testi'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main {
            java.srcDirs += [
                file('../vendor/brouter/brouter-core/src/main/java'),
                file('../vendor/brouter/brouter-mapaccess/src/main/java'),
                file('../vendor/brouter/brouter-util/src/main/java'),
                file('../vendor/brouter/brouter-expressions/src/main/java'),
                file('../vendor/brouter/brouter-codec/src/main/java')
            ]
        }
    }
    buildTypes {
        release { minifyEnabled false }
    }
}
dependencies {
    implementation 'org.mapsforge:mapsforge-map-android:0.25.0'
    implementation 'org.mapsforge:mapsforge-themes:0.25.0'
}
