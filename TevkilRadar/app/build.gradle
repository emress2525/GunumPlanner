plugins { id 'com.android.application' }

android {
    namespace 'com.tevkil.radar'
    compileSdk 35
    defaultConfig {
        applicationId 'com.tevkil.radar'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.3.0'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true }
}

dependencies {
    // Bundled Latin OCR model: works locally without sending case images to a server.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
