name: Android APK - Tevkil Radari
on:
  push:
    branches:
      - 'tevkil-radari-mvp'
  pull_request:
    paths:
      - 'TevkilRadar/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TevkilRadar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Pure Java matching tests
        run: |
          mkdir -p tests/build
          javac -encoding UTF-8 -d tests/build app/src/main/java/com/tevkil/radar/FilterEngine.java tests/FilterEngineTest.java
          java -cp tests/build FilterEngineTest
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Android lint
        run: gradle :app:lintDebug --no-daemon
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: TevkilRadari-debug-apk
          path: TevkilRadar/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
